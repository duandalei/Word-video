/* ── Design plan ────────────────────────────────────────────────
   Subject: 20 words from "Five little ducks" — five ducklings waddle
            out one day, cross the hills, get far away, then come
            back to the pond; lotus flowers and leaves on the water,
            and the numbers eleven to twenty.
   Color  : morning pond — pale mint sky, duck gold, reed green and
            water teal. The accent re-tints at every stop so the rail
            reads as a small journey around the water.
   Type   : Baloo 2 (rounded display: word, title, numerals)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, pond stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#F2F7F0;
  --bg-glow:#DCEDD6;
  --surface:#FFFDF6;
  --surface-2:#EAF3E4;
  --ink:#22352A;
  --ink-soft:#71866F;
  --line:#D6E3CF;
  --accent:#2F9E8F;
  --accent-deep:#176E62;
  --accent-ink:var(--accent-deep);
  --accent-soft:rgba(47,158,143,.16);
  --shadow:0 20px 44px -22px rgba(36,82,54,.35), 0 2px 6px rgba(36,82,54,.06);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1713;
    --bg-glow:#16291E;
    --surface:#18231C;
    --surface-2:#1F2D24;
    --ink:#EEF7E9;
    --ink-soft:#9DB3A2;
    --line:#2C3E31;
    --accent-ink:var(--accent);
    --accent-soft:rgba(47,158,143,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .btn.primary,
  :root:not([data-theme="light"]) .coach{color:#0B1410}
}
:root[data-theme="dark"]{
  --bg:#0F1713;
  --bg-glow:#16291E;
  --surface:#18231C;
  --surface-2:#1F2D24;
  --ink:#EEF7E9;
  --ink-soft:#9DB3A2;
  --line:#2C3E31;
  --accent-ink:var(--accent);
  --accent-soft:rgba(47,158,143,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .coach{color:#0B1410}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}
.audio-status{
  margin-right:auto;
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
  padding:3px 10px 3px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  opacity:0;
  transform:translateY(-2px);
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
}
.audio-status.on{opacity:1;transform:none}
.audio-status.done{opacity:0;transform:translateY(-4px)}
.audio-status i{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:audioPulse 1s ease-in-out infinite;
}
@keyframes audioPulse{
  0%,100%{opacity:.35;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* pond stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(156px,26vh,212px);
  isolation:isolate;
}
.glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.18;
  filter:blur(40px);
  transition:background .3s ease;
  z-index:0;
}
.sun{
  position:absolute;
  top:8px;right:13%;
  width:46px;height:46px;
  border-radius:50%;
  background:#F1C24E;
  box-shadow:0 0 0 10px rgba(241,194,78,.18), 0 12px 24px rgba(130,99,32,.12);
  opacity:.85;
  z-index:1;
}
.hills{
  position:absolute;
  left:-8%;right:-8%;bottom:44px;
  height:78px;
  pointer-events:none;
  z-index:1;
}
.hills span{
  position:absolute;
  bottom:0;
  border-radius:50% 50% 0 0;
  background:var(--accent-soft);
  transition:background .3s ease;
}
.hills span:nth-child(1){left:2%;width:64%;height:64px}
.hills span:nth-child(2){right:0;width:56%;height:48px;opacity:.7}
.pond{
  position:absolute;
  left:-10%;right:-10%;bottom:0;
  height:58px;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}
.pond span{
  position:absolute;
  left:-5%;
  width:110%;
  height:32px;
  border-radius:50%;
  background:var(--accent-soft);
  filter:blur(1px);
  transition:background .3s ease;
}
.pond span:nth-child(1){top:8px;animation:pondA 7s ease-in-out infinite alternate}
.pond span:nth-child(2){top:24px;opacity:.72;animation:pondB 9s ease-in-out infinite alternate}
.pond span:nth-child(3){top:2px;left:16%;width:64%;opacity:.45;animation:pondB 6s ease-in-out infinite alternate-reverse}
@keyframes pondA{from{transform:translateX(-2%) scaleX(1)}to{transform:translateX(3%) scaleX(1.04)}}
@keyframes pondB{from{transform:translateX(2%) scaleX(1.03)}to{transform:translateX(-3%) scaleX(1)}}
.reed{
  position:absolute;
  bottom:38px;
  z-index:2;
  font-size:30px;
  line-height:1;
  opacity:.7;
  filter:drop-shadow(0 6px 8px rgba(32,66,45,.12));
  animation:reedSway 4.5s ease-in-out infinite alternate;
  pointer-events:none;
}
.reed.l{left:5%;transform-origin:50% 100%}
@keyframes reedSway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}

.art{
  position:relative;
  z-index:3;
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:calc(clamp(74px,19vw,118px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(32,66,45,.22));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(32,66,45,.3))}
.art-sm{
  position:absolute;
  right:12%;
  bottom:11%;
  z-index:4;
  font-size:40px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(32,66,45,.18));
  animation:companionFloat 3.2s ease-in-out infinite;
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}
@keyframes companionFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

/* one motion per stop: waddle off, glide over hills, drift far away,
   come back, splash in the pond, a compass quest, hatch, a small
   flock, a lotus opening, a leaf swaying, and a counting bounce */
.art.anim-waddle{transform-origin:50% 88%;animation:waddle 1.2s ease-in-out 2}
@keyframes waddle{
  0%,100%{transform:rotate(0) translate(0,0)}
  15%{transform:rotate(-8deg) translate(-8px,-3px)}
  30%{transform:rotate(0) translate(0,0)}
  45%{transform:rotate(8deg) translate(8px,-3px)}
  60%{transform:rotate(0) translate(0,0)}
  75%{transform:rotate(-5deg) translate(-4px,-2px)}
  90%{transform:rotate(3deg)}
}
.art.anim-glide{animation:hillGlide 1.7s ease-in-out 2}
@keyframes hillGlide{
  0%,100%{transform:translate(0,0) rotate(0)}
  30%{transform:translate(16px,-12px) rotate(-3deg)}
  60%{transform:translate(36px,-22px) rotate(3deg)}
  82%{transform:translate(12px,-6px)}
}
.art.anim-drift{animation:farDrift 2s ease-in-out 2}
@keyframes farDrift{
  0%,100%{transform:translate(0,0) scale(1);opacity:1}
  35%{transform:translate(26px,-16px) scale(.86);opacity:1}
  65%{transform:translate(48px,-32px) scale(.64);opacity:.55}
  80%{transform:translate(0,0) scale(1);opacity:1}
}
.art.anim-return{animation:comeBack 1.6s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes comeBack{
  0%{transform:translateX(46px) rotate(6deg);opacity:.35}
  45%{transform:translateX(-16px) rotate(-4deg);opacity:1}
  70%{transform:translateX(6px)}
  85%{transform:translateX(-2px)}
  100%{transform:none;opacity:1}
}
.art.anim-splash{animation:pondSplash 1.25s ease-in-out 2}
@keyframes pondSplash{
  0%,100%{transform:translateY(0) scale(1,1)}
  18%{transform:translateY(16px) scale(1.08,.86)}
  40%{transform:translateY(-13px) scale(.94,1.08)}
  62%{transform:translateY(4px) scale(1.03,.97)}
  80%{transform:translateY(-3px)}
}
.art.anim-quest{animation:compassTurn 1.5s ease-in-out 2}
@keyframes compassTurn{
  0%,100%{transform:rotate(0) scale(1)}
  15%{transform:rotate(-14deg) scale(1.04)}
  35%{transform:rotate(12deg) scale(1.02)}
  55%{transform:rotate(-8deg)}
  75%{transform:rotate(5deg) scale(1.03)}
  90%{transform:rotate(-2deg)}
}
.art.anim-hatch{animation:hatchPop 1.15s cubic-bezier(.25,1.3,.4,1) 2}
@keyframes hatchPop{
  0%{transform:scale(.55) rotate(-8deg);opacity:.35}
  55%{transform:scale(1.18) rotate(3deg);opacity:1}
  75%{transform:scale(.94) rotate(-1deg)}
  90%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
.art.anim-flock{animation:flockBob 1.2s ease-in-out 2}
@keyframes flockBob{
  0%,100%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(-14px) rotate(-4deg)}
  40%{transform:translateY(0) rotate(0)}
  55%{transform:translateY(-9px) rotate(3deg)}
  70%{transform:translateY(0) rotate(0)}
  85%{transform:translateY(-4px)}
}
.art.anim-bloom{animation:lotusBloom 1.6s cubic-bezier(.25,1.2,.4,1) 2}
@keyframes lotusBloom{
  0%{transform:scale(.5) rotate(-12deg);opacity:.35}
  55%{transform:scale(1.16) rotate(4deg);opacity:1}
  75%{transform:scale(.96) rotate(-1deg)}
  90%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
.art.anim-leaf{animation:leafSway 2.2s ease-in-out 2}
@keyframes leafSway{
  0%,100%{transform:rotate(-4deg) translateY(0)}
  30%{transform:rotate(4deg) translateY(-6px)}
  60%{transform:rotate(-3deg) translateY(-2px)}
  80%{transform:rotate(2deg) translateY(-4px)}
}
.art.anim-count{animation:countBounce 1.1s cubic-bezier(.3,1.2,.4,1) 2}
@keyframes countBounce{
  0%,100%{transform:translateY(0) scale(1)}
  25%{transform:translateY(-16px) scale(1.12)}
  45%{transform:translateY(0) scale(.96)}
  65%{transform:translateY(-7px) scale(1.04)}
  82%{transform:translateY(0) scale(.99)}
}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
  max-width:100%;
  overflow-wrap:anywhere;
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:6;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:600px){
  .card{padding-bottom:52px}
  .coach{bottom:8px}
}
@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(23px,6.6vw,30px)}
  .art-sm{right:9%;font-size:34px}
  .reed{font-size:25px}
  .sun{width:38px;height:38px;right:9%}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="audio-status" id="audioStatus" aria-hidden="true"><i></i><span id="audioCount"></span></div>
    <div class="prog" id="prog">1 / 20</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="glow"></div>
      <div class="sun" aria-hidden="true"></div>
      <div class="hills" aria-hidden="true"><span></span><span></span></div>
      <div class="pond" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="reed l" aria-hidden="true">🌾</span>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">🐥</div>
      <div class="art-sm" id="artSm" data-label="one day" hidden>🌤️</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta" aria-live="polite">
      <span class="w" id="mWord">go out one day</span>
      <span class="ipa" id="mIpa">/ɡoʊ aʊt wʌn deɪ/</span>
      <span class="cn" id="mCn">有一天出门</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="slow" aria-pressed="false">🐢 慢速</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"go out one day",     ipa:"/ɡoʊ aʊt wʌn deɪ/",       cn:"有一天出门",       art:"🐥",        scale:1,    color:"#D99A2B", ink:"#8C5B0B", anim:"waddle", fx:["🐤","🌤️","✨"], small:"🌤️", smallLabel:"one day" },
    { word:"over the hills",     ipa:"/ˈoʊvər ðə hɪlz/",        cn:"越过山丘",         art:"⛰️",        scale:1,    color:"#6FA35A", ink:"#436B34", anim:"glide",  fx:["🍃","☁️","✨"], small:"🐥", smallLabel:"duckling" },
    { word:"far away",           ipa:"/ˌfɑːr əˈweɪ/",           cn:"很远；远方",       art:"🌄",        scale:1,    color:"#7C8FC9", ink:"#4A5C9C", anim:"drift",  fx:["💨","☁️","✨"], small:"🐥", smallLabel:"duckling" },
    { word:"come back",          ipa:"/kʌm bæk/",               cn:"回来",             art:"↩️",        scale:.94,  color:"#C97B52", ink:"#8D4A28", anim:"return", fx:["🐤","💧","✨"], small:"🐥", smallLabel:"duckling" },
    { word:"in the pond",        ipa:"/ɪn ðə pɑːnd/",           cn:"在池塘里",         art:"🌊",        scale:1,    color:"#3C9CC9", ink:"#1E6D91", anim:"splash", fx:["💧","🪷","✨"], small:"🐥", smallLabel:"duckling" },
    { word:"an adventure",       ipa:"/ən ədˈventʃər/",         cn:"一次冒险",         art:"🧭",        scale:1,    color:"#8B6BC9", ink:"#5A3E9C", anim:"quest",  fx:["🗺️","✨","🌟"], small:"🐥", smallLabel:"duckling" },
    { word:"baby duckling",      ipa:"/ˈbeɪbi ˈdʌklɪŋ/",        cn:"小鸭子；鸭宝宝",   art:"🐤",        scale:1,    color:"#E0A51F", ink:"#8D6400", anim:"hatch",  fx:["🐣","💛","✨"] },
    { word:"ducklings",          ipa:"/ˈdʌklɪŋz/",              cn:"小鸭子们",         art:"🐥🐥🐥",    scale:.66,  color:"#D9862D", ink:"#905614", anim:"flock",  fx:["🐤","💧","✨"], chip:"🐥", small:"🦆", smallLabel:"mother duck" },
    { word:"a lotus flower",     ipa:"/ə ˈloʊtəs ˈflaʊər/",      cn:"一朵荷花",         art:"🪷",        scale:1,    color:"#D9779A", ink:"#A03E60", anim:"bloom",  fx:["🌸","💧","✨"] },
    { word:"a lotus leaf",       ipa:"/ə ˈloʊtəs liːf/",        cn:"一片荷叶",         art:"🍃",        scale:1,    color:"#5F9E3F", ink:"#3B6B24", anim:"leaf",   fx:["💧","🍃","✨"], small:"🪷", smallLabel:"lotus" },
    { word:"eleven",             ipa:"/ɪˈlevn/",                cn:"十一",             art:"11",        scale:1,    color:"#2F9E8F", ink:"#176E62", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"twelve",             ipa:"/twelv/",                 cn:"十二",             art:"12",        scale:1,    color:"#3C9CC9", ink:"#1E6D91", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"thirteen",           ipa:"/ˌθɜːrˈtiːn/",            cn:"十三",             art:"13",        scale:1,    color:"#7C6BC9", ink:"#4E3E9E", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"fourteen",           ipa:"/ˌfɔːrˈtiːn/",            cn:"十四",             art:"14",        scale:1,    color:"#E07A2C", ink:"#9D4D0B", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"fifteen",            ipa:"/ˌfɪfˈtiːn/",             cn:"十五",             art:"15",        scale:1,    color:"#5F9E3F", ink:"#3B6B24", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"sixteen",            ipa:"/ˌsɪksˈtiːn/",            cn:"十六",             art:"16",        scale:1,    color:"#D9779A", ink:"#A03E60", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"seventeen",          ipa:"/ˌsevənˈtiːn/",            cn:"十七",             art:"17",        scale:1,    color:"#3D9E62", ink:"#1F6B3C", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"eighteen",           ipa:"/ˌeɪˈtiːn/",              cn:"十八",             art:"18",        scale:1,    color:"#B58A5E", ink:"#7F5A32", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"nineteen",           ipa:"/ˌnaɪnˈtiːn/",            cn:"十九",             art:"19",        scale:1,    color:"#E2574C", ink:"#A82E26", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" },
    { word:"twenty",             ipa:"/ˈtwenti/",               cn:"二十",             art:"20",        scale:1,    color:"#2F7D4F", ink:"#18542F", anim:"count",  fx:["🔢","✨","🐤"], chip:"🔢", small:"🐥", smallLabel:"duckling" }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, slow = false, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  var audio = new Audio();
  audio.preload = "auto";

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  // 用 fetch 预取本课全部音频并存成 Blob，点击时直接播放本地数据，不再等待网络
  // （iOS Safari 会忽略 Audio 的 preload，fetch 不受自动播放策略限制）
  var blobUrls = {};
  var elAudioStatus = $("audioStatus"), elAudioCount = $("audioCount");
  var audioTotal = LESSONS.length, audioLoaded = 0, audioStatusTimer = null;

  function audioDone(){
    clearTimeout(audioStatusTimer);
    if(elAudioStatus.classList.contains("on")){
      elAudioStatus.classList.add("done");
      setTimeout(function(){ elAudioStatus.classList.remove("on", "done"); }, 400);
    }
  }

  function audioProgress(){
    audioLoaded++;
    elAudioCount.textContent = audioLoaded + "/" + audioTotal;
    if(audioLoaded === audioTotal) audioDone();
  }

  elAudioCount.textContent = "0/" + audioTotal;

  if(window.fetch){
    // 预取超过 150ms 才显示进度，避免缓存命中时闪一下
    audioStatusTimer = setTimeout(function(){
      if(audioLoaded < audioTotal) elAudioStatus.classList.add("on");
    }, 150);
    LESSONS.forEach(function(L){
      var url = audioUrl(L.word);
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.blob();
      }).then(function(b){
        blobUrls[url] = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
      }).catch(function(){}).then(audioProgress);
    });
  }

  function cancelSpeech(){
    try{ audio.pause(); }catch(e){}
    audio.onended = null;
    audio.onerror = null;
    try{ audio.currentTime = 0; }catch(e){}
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    var url = audioUrl(L.word);
    audio.src = blobUrls[url] || url;
    audio.playbackRate = slow ? 0.72 : 1;
    audio.onended = function(){ if(wordActive) finishWord(); };
    audio.onerror = function(){ if(wordActive) finishWord(); };
    var p = audio.play();
    if(p && p.catch){
      p.catch(function(err){
        if(err && err.name === "AbortError") return;
        if(wordActive) finishWord();
      });
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-deep", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    elArt.textContent = L.art;
    elArt.setAttribute("aria-label", "点击朗读 " + L.word);
    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) readWord();
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setSlow(v){
    slow = v;
    $("slow").setAttribute("aria-pressed", v ? "true" : "false");
  }
  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("slow").addEventListener("click", function(){ dismissCoach(); setSlow(!slow); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
<script src="sw-register.js"></script>
