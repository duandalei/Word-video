/* ── Design plan ────────────────────────────────────────────────
   Subject: 13 words for one small kitten's day — a pet, a ball of
            yarn, a dash, then every mood the Soft Kitty song names.
            The stage emoji is the thing the word is about; the small
            corner emoji keeps the kitten present when the stage is a
            cloud, a bowl or a sunbeam
   Color  : blush-paper ground + ink that stays plum-biased; the
            accent is re-tinted per stop — rose, coral, amber, sky,
            caramel, orange, violet, pink, teal, red, periwinkle,
            blue, mint — so the rail reads as a mood changing
   Type   : Baloo 2 (rounded display: word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, reading stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#FFF7F2;
  --bg-glow:#FFE1D6;
  --surface:#FFFDFC;
  --surface-2:#FFF0E9;
  --ink:#32232A;
  --ink-soft:#8F7A80;
  --line:#F1DEDB;
  --accent:#E86A8A;
  --accent-ink:#B32862;
  --accent-soft:rgba(232,106,138,.16);
  --shadow:0 20px 44px -22px rgba(122,60,80,.45), 0 2px 6px rgba(122,60,80,.07);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161113;
    --bg-glow:#241419;
    --surface:#221A1D;
    --surface-2:#2A2024;
    --ink:#FAEFF2;
    --ink-soft:#B29CA3;
    --line:#3C2C31;
    --accent-ink:var(--accent);
    --accent-soft:rgba(232,106,138,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161113;
  --bg-glow:#241419;
  --surface:#221A1D;
  --surface-2:#2A2024;
  --ink:#FAEFF2;
  --ink-soft:#B29CA3;
  --line:#3C2C31;
  --accent-ink:var(--accent);
  --accent-soft:rgba(232,106,138,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* kitten stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(132px,24vh,190px);
}
.glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.18;
  filter:blur(40px);
  transition:background .3s ease;
}
.art{
  position:relative;
  font-size:calc(clamp(74px,19vw,118px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(90,40,60,.2));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(90,40,60,.28))}
.art-sm{
  position:absolute;
  right:12%;
  bottom:10%;
  font-size:40px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(90,40,60,.18));
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}

/* one motion per stop: the intro pounce, a paw at the yarn, a dash,
   then a mood each — squish, roll, bask, purr, puff, rumble, swat,
   hush, lap, and finally shrinking down to tiny */
.art.anim-pounce{animation:pounceIn .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pounceIn{
  0%{transform:translateY(-30px) scale(.7);opacity:0}
  55%{transform:translateY(6px) scale(1.08,.94);opacity:1}
  75%{transform:translateY(-4px) scale(.98,1.02)}
  100%{transform:translateY(0) scale(1)}
}
.art.anim-bat{transform-origin:62% 70%;animation:bat 1.1s ease-in-out 2}
@keyframes bat{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-18deg)}
  45%{transform:rotate(14deg)}
  65%{transform:rotate(-8deg)}
  82%{transform:rotate(4deg)}
}
.art.anim-zoom{animation:zoom 1.5s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes zoom{
  0%,100%{transform:translateX(0) scale(1,1)}
  18%{transform:translateX(-58px) scale(1.06,.96)}
  36%{transform:translateX(58px) scale(.94,1.06)}
  54%{transform:translateX(-28px)}
  72%{transform:translateX(20px)}
  88%{transform:translateX(-6px)}
}
.art.anim-squish{animation:squish 1.8s ease-in-out 2}
@keyframes squish{
  0%,100%{transform:scale(1,1) translateY(0)}
  30%{transform:scale(1.12,.84) translateY(8px)}
  55%{transform:scale(.9,1.14) translateY(-6px)}
  78%{transform:scale(1.05,.96) translateY(2px)}
}
.art.anim-roll{animation:rollAround 1.8s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes rollAround{
  0%,100%{transform:rotate(0) translateX(0)}
  40%{transform:rotate(160deg) translateX(38px)}
  70%{transform:rotate(280deg) translateX(-22px)}
}
.art.anim-bask{animation:bask 2.6s ease-in-out 2}
@keyframes bask{
  0%,100%{transform:scale(1) rotate(0)}
  50%{transform:scale(1.1) rotate(4deg);filter:drop-shadow(0 0 26px rgba(240,134,43,.8))}
}
.art.anim-purr{animation:purr 1.4s linear 2}
@keyframes purr{
  0%,100%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-2px,0) rotate(-1deg)}
  20%{transform:translate(2px,0) rotate(1deg)}
  30%{transform:translate(-2px,0) rotate(-1deg)}
  40%{transform:translate(2px,0) rotate(1deg)}
  50%{transform:translate(-1px,0) rotate(-.5deg)}
  60%{transform:translate(1px,0) rotate(.5deg)}
  70%{transform:translate(-1px,0) rotate(-.5deg)}
  80%{transform:translate(1px,0) rotate(.5deg)}
  90%{transform:translate(-.5px,0)}
}
.art.anim-fluff{animation:fluff 1.7s cubic-bezier(.3,1.2,.4,1) 2}
@keyframes fluff{
  0%,100%{transform:scale(1,1)}
  30%{transform:scale(1.22,1.18)}
  55%{transform:scale(.96,.98)}
  75%{transform:scale(1.08,1.06)}
}
.art.anim-rumble{transform-origin:50% 80%;animation:rumble 1.4s ease-in-out 2}
@keyframes rumble{
  0%,100%{transform:scale(1,1) rotate(0)}
  20%{transform:scale(1.08,.94) rotate(-3deg)}
  40%{transform:scale(.96,1.06) rotate(3deg)}
  60%{transform:scale(1.06,.95) rotate(-2deg)}
  80%{transform:scale(.98,1.02) rotate(1deg)}
}
.art.anim-swat{transform-origin:40% 65%;animation:swat 1.15s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes swat{
  0%,100%{transform:rotate(0) translateX(0)}
  15%{transform:rotate(18deg) translateX(10px)}
  30%{transform:rotate(-20deg) translateX(-14px)}
  45%{transform:rotate(12deg) translateX(8px)}
  60%{transform:rotate(-7deg) translateX(-4px)}
}
.art.anim-hush{animation:hush 2s ease-in-out 2}
@keyframes hush{
  0%,100%{transform:scale(1) translateY(0);opacity:1}
  50%{transform:scale(.9) translateY(6px);opacity:.86}
}
.art.anim-lap{transform-origin:50% 78%;animation:lap 1.15s ease-in-out 3}
@keyframes lap{
  0%,100%{transform:rotate(0) translateY(0)}
  35%{transform:rotate(-9deg) translateY(10px)}
  60%{transform:rotate(-3deg) translateY(2px)}
}
.art.anim-shrink{animation:shrink 1.8s cubic-bezier(.3,1.05,.4,1) 2}
@keyframes shrink{
  0%,100%{transform:scale(1)}
  30%{transform:scale(.45)}
  60%{transform:scale(.45)}
  80%{transform:scale(.62)}
}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:5;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(24px,7vw,30px)}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="prog" id="prog">1 / 13</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="glow"></div>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">🐈</div>
      <div class="art-sm" id="artSm" data-label="kitty" hidden>🐈</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta">
      <span class="w" id="mWord">pet</span>
      <span class="ipa" id="mIpa">/pet/</span>
      <span class="cn" id="mCn">抚摸；宠物</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="slow" aria-pressed="false">🐢 慢速</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"pet",                ipa:"/pet/",                  cn:"抚摸；宠物",   art:"🐈",  scale:1,    color:"#E86A8A", ink:"#B32862", anim:"pounce", fx:["💗","🐾","✨"] },
    { word:"yarn",               ipa:"/jɑːrn/",                cn:"毛线球",       art:"🧶",  scale:1,    color:"#F2764B", ink:"#B4421C", anim:"bat",    fx:["🧶","🐾","✨"] },
    { word:"fast and quick",     ipa:"/fæst ənd kwɪk/",        cn:"又快又敏捷",   art:"💨",  scale:1,    color:"#F5B301", ink:"#9A6B00", anim:"zoom",   fx:["💨","🐾","✨"], small:"🐈", smallLabel:"kitty" },
    { word:"soft kitty",         ipa:"/sɔːft ˈkɪti/",          cn:"柔软的猫咪",   art:"☁️",  scale:1,    color:"#4FA8D8", ink:"#256E9C", anim:"squish", fx:["☁️","💗","✨"], small:"🐱", smallLabel:"kitty" },
    { word:"little ball of fur", ipa:"/ˈlɪtl bɔːl əv fɜːr/",   cn:"小毛球",       art:"🐈",  scale:.82,  color:"#C98A3E", ink:"#8E5A1A", anim:"roll",   fx:["🧶","✨","🐾"] },
    { word:"warm kitty",         ipa:"/wɔːrm ˈkɪti/",          cn:"温暖的猫咪",   art:"☀️",  scale:1,    color:"#F0862B", ink:"#B85408", anim:"bask",   fx:["☀️","💛","✨"], small:"🐈", smallLabel:"kitty" },
    { word:"purr",               ipa:"/pɜːr/",                 cn:"呼噜声",       art:"😽",  scale:1,    color:"#8E7BD8", ink:"#5F4CA8", anim:"purr",   fx:["💗","🎵","✨"] },
    { word:"fluffy kitty",       ipa:"/ˈflʌfi ˈkɪti/",         cn:"毛茸茸的猫咪", art:"🐈",  scale:1.02, color:"#E2568C", ink:"#B32862", anim:"fluff",  fx:["☁️","✨","💗"] },
    { word:"hungry kitty",       ipa:"/ˈhʌŋɡri ˈkɪti/",        cn:"饿了的猫咪",   art:"🐟",  scale:1,    color:"#2F9FB8", ink:"#16738A", anim:"rumble", fx:["🐟","🍽️","✨"], small:"🐈", smallLabel:"kitty" },
    { word:"naughty kitty",      ipa:"/ˈnɔːti ˈkɪti/",         cn:"淘气的猫咪",   art:"😼",  scale:1,    color:"#E5484D", ink:"#C0272D", anim:"swat",   fx:["🐾","💥","✨"] },
    { word:"quiet kitty",        ipa:"/ˈkwaɪət ˈkɪti/",        cn:"安静的猫咪",   art:"🤫",  scale:1,    color:"#6A8FD8", ink:"#4463A8", anim:"hush",   fx:["💤","✨","🌙"], small:"🐈", smallLabel:"kitty" },
    { word:"thirsty kitty",      ipa:"/ˈθɜːrsti ˈkɪti/",       cn:"渴了的猫咪",   art:"🥛",  scale:1,    color:"#2FA8E0", ink:"#16719E", anim:"lap",    fx:["💧","🥛","✨"], small:"🐈", smallLabel:"kitty" },
    { word:"tiny kitty",         ipa:"/ˈtaɪni ˈkɪti/",         cn:"小小的猫咪",   art:"🐈",  scale:.95,  color:"#5BAE9E", ink:"#2F7D6E", anim:"shrink", fx:["✨","🐾","💗"] }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, slow = false, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  var audio = new Audio();
  audio.preload = "auto";

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  // 用 fetch 预取本课全部音频并存成 Blob，点击时直接播放本地数据，不再等待网络
  // （iOS Safari 会忽略 Audio 的 preload，fetch 不受自动播放策略限制）
  var blobUrls = {};
  if(window.fetch){
    LESSONS.forEach(function(L){
      var url = audioUrl(L.word);
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.blob();
      }).then(function(b){
        blobUrls[url] = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
      }).catch(function(){});
    });
  }

  function cancelSpeech(){
    try{ audio.pause(); }catch(e){}
    audio.onended = null;
    audio.onerror = null;
    try{ audio.currentTime = 0; }catch(e){}
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    var url = audioUrl(L.word);
    audio.src = blobUrls[url] || url;
    audio.playbackRate = slow ? 0.72 : 1;
    audio.onended = function(){ if(wordActive) finishWord(); };
    audio.onerror = function(){ if(wordActive) finishWord(); };
    var p = audio.play();
    if(p && p.catch){
      p.catch(function(err){
        if(err && err.name === "AbortError") return;
        if(wordActive) finishWord();
      });
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-ink", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    elArt.textContent = L.art;
    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) readWord();
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setSlow(v){
    slow = v;
    $("slow").setAttribute("aria-pressed", v ? "true" : "false");
  }
  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("slow").addEventListener("click", function(){ dismissCoach(); setSlow(!slow); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
