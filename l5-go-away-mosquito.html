<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L5 Go away mosquito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;900&display=swap">
<style>
/* ── Design plan ────────────────────────────────────────────────
   Subject: 16 words that walk a child through the body — a mosquito
            bite, then head to toe, then the private places that are
            only for you, and the trusted adult you can tell.
            Body words share one friendly figure; the part being
            named gets a soft pulsing ring, so the stage reads as a
            body map rather than a row of unrelated pictures.
   Color  : fresh mint-paper ground + ink that stays forest-biased;
            the accent is re-tinted per stop, from olive (mosquito)
            to red (blood) to warm green (trusted adult)
   Type   : Baloo 2 (rounded display: word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, reading stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#F5FBF7;
  --bg-glow:#DCEFE2;
  --surface:#FFFFFF;
  --surface-2:#EDF8F1;
  --ink:#1E2A23;
  --ink-soft:#6C8175;
  --line:#D6E8DD;
  --accent:#4C9A7A;
  --accent-ink:#2E7458;
  --accent-soft:rgba(76,154,122,.16);
  --shadow:0 20px 44px -22px rgba(34,84,58,.38), 0 2px 6px rgba(34,84,58,.06);
  --r-card:26px;
  --r-ctl:16px;
  --skin:#F2C9A6;
  --skin-line:#D3A27B;
  --hair:#3A2A26;
  --shirt:#8FCBB7;
  --shorts:#5FA48D;
  --shoe:#E86A5A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613;
    --bg-glow:#18251E;
    --surface:#18211C;
    --surface-2:#202B25;
    --ink:#EFF8F1;
    --ink-soft:#9BB2A5;
    --line:#2D3D34;
    --accent-ink:var(--accent);
    --accent-soft:rgba(76,154,122,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    --skin:#E0B18C;
    --skin-line:#BD8B68;
    --hair:#2A1E1B;
    --shirt:#6FAF9A;
    --shorts:#4C8E77;
    --shoe:#D95D4E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101613;
  --bg-glow:#18251E;
  --surface:#18211C;
  --surface-2:#202B25;
  --ink:#EFF8F1;
  --ink-soft:#9BB2A5;
  --line:#2D3D34;
  --accent-ink:var(--accent);
  --accent-soft:rgba(76,154,122,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  --skin:#E0B18C;
  --skin-line:#BD8B68;
  --hair:#2A1E1B;
  --shirt:#6FAF9A;
  --shorts:#4C8E77;
  --shoe:#D95D4E;
  color-scheme: dark;
}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* body-map stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(156px,28vh,236px);
}
.glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.18;
  filter:blur(40px);
  transition:background .3s ease;
}
.art{
  position:relative;
  font-size:calc(clamp(74px,19vw,118px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(40,80,58,.18));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(40,80,58,.26))}

/* the shared body figure */
.figure{
  height:clamp(148px,26vh,218px);
  width:auto;
  display:block;
  overflow:visible;
}
.face-figure{height:clamp(150px,25vh,202px)}
.figure .skin{fill:var(--skin)}
.figure .hair{fill:var(--hair)}
.figure .shirt{fill:var(--shirt)}
.figure .shorts{fill:var(--shorts)}
.figure .shoe{fill:var(--shoe)}
.figure .arm{fill:none;stroke:var(--skin);stroke-width:10;stroke-linecap:round}
.figure .leg{fill:none;stroke:var(--skin);stroke-width:12;stroke-linecap:round}
.figure .eye{fill:#2E2320}
.figure .line{fill:none;stroke:var(--skin-line);stroke-width:2;stroke-linecap:round}
.figure .smile{fill:none;stroke:#B26B58;stroke-width:2;stroke-linecap:round}
.figure .heart{fill:rgba(255,255,255,.55)}
.figure .blush{fill:#F09A93;opacity:.28}
.figure g{transform-box:fill-box;transform-origin:center}
.figure .ring{
  fill:none;
  stroke:var(--accent-ink);
  stroke-width:3.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  transform-box:fill-box;
  transform-origin:center;
  filter:drop-shadow(0 0 7px var(--accent-soft));
  animation:ringPulse 1.7s ease-in-out infinite;
}
.figure .shield{
  fill:var(--accent-soft);
  stroke:var(--accent-ink);
  stroke-width:2.5;
  stroke-linejoin:round;
  transform-box:fill-box;
  transform-origin:center;
  animation:shieldPulse 1.7s ease-in-out infinite;
}
.figure .dot{
  fill:var(--accent-ink);
  transform-box:fill-box;
  transform-origin:center;
  animation:dotPulse 1.5s ease-in-out infinite;
}
.figure .pointer{
  fill:none;
  stroke:var(--accent-ink);
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-dasharray:2 5;
  opacity:.85;
}
@keyframes ringPulse{
  0%,100%{opacity:.7;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}
@keyframes dotPulse{
  0%,100%{transform:scale(.8);opacity:.6}
  50%{transform:scale(1.2);opacity:1}
}
@keyframes shieldPulse{
  0%,100%{opacity:.55;transform:scale(1)}
  50%{opacity:1;transform:scale(1.06)}
}

/* one motion per stop */
.art.anim-buzz{animation:buzz 1.8s ease-in-out 2}
@keyframes buzz{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-22px,-14px) rotate(-8deg)}
  40%{transform:translate(18px,-24px) rotate(6deg)}
  60%{transform:translate(-12px,-6px) rotate(-4deg)}
  80%{transform:translate(10px,-18px) rotate(3deg)}
}
.art.anim-bite{transform-origin:50% 70%;animation:bite 1s ease-in-out 2}
@keyframes bite{
  0%,100%{transform:scale(1) rotate(0)}
  16%{transform:scale(1.08,.94) rotate(-2deg)}
  32%{transform:scale(.95,1.05) rotate(2deg)}
  52%{transform:scale(1.03,.98) rotate(-1deg)}
}
.art.anim-drip{animation:drip 1.6s ease-in-out 2}
@keyframes drip{
  0%,100%{transform:translateY(0) scale(1)}
  45%{transform:translateY(10px) scale(1.08,.94)}
  70%{transform:translateY(3px) scale(.98,1.02)}
}
.art.anim-trust{animation:trust 2s ease-in-out 2}
@keyframes trust{
  0%,100%{transform:scale(1);filter:drop-shadow(0 16px 20px rgba(40,80,58,.18))}
  50%{transform:scale(1.08);filter:drop-shadow(0 0 26px rgba(76,154,122,.8))}
}

/* body-map part motions */
.art.anim-body #figure{animation:bodySway 1.8s ease-in-out 2}
@keyframes bodySway{
  0%,100%{transform:rotate(0)}
  30%{transform:rotate(-1.5deg)}
  60%{transform:rotate(1.5deg)}
}
.art.anim-head #headG{animation:headBob 1.2s ease-in-out 2}
@keyframes headBob{
  0%,100%{transform:translateY(0) rotate(0)}
  30%{transform:translateY(-4px) rotate(-5deg)}
  65%{transform:translateY(1px) rotate(4deg)}
}
.art.anim-nose #headG{animation:noseWiggle 1.2s ease-in-out 2}
@keyframes noseWiggle{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-3deg)}
  50%{transform:rotate(3deg)}
  75%{transform:rotate(-1deg)}
}
.art.anim-chin #headG{transform-origin:50% 80%;animation:chinNod 1.3s ease-in-out 2}
@keyframes chinNod{
  0%,100%{transform:rotate(0)}
  30%{transform:rotate(6deg)}
  60%{transform:rotate(-2deg)}
}
.art.anim-shoulder #torsoG,
.art.anim-shoulder #armLeftG,
.art.anim-shoulder #armRightG{animation:shrug 1.2s ease-in-out 2}
@keyframes shrug{
  0%,100%{transform:translateY(0)}
  35%{transform:translateY(-5px)}
  65%{transform:translateY(1px)}
}
.art.anim-arm #armLeftG{transform-origin:50% 5%;animation:armWave 1.2s ease-in-out 2}
@keyframes armWave{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-18deg)}
  50%{transform:rotate(10deg)}
  75%{transform:rotate(-12deg)}
}
.art.anim-hand #handLeftG{animation:handWave 1s ease-in-out 2}
@keyframes handWave{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-18deg)}
  50%{transform:rotate(14deg)}
  75%{transform:rotate(-8deg)}
}
.art.anim-knee #legLeftG{transform-origin:50% 0%;animation:kneeBend 1.2s ease-in-out 2}
@keyframes kneeBend{
  0%,100%{transform:rotate(0)}
  30%{transform:rotate(-8deg)}
  60%{transform:rotate(4deg)}
}
.art.anim-feet #footLeftG,
.art.anim-feet #footRightG{animation:footTap 1s ease-in-out 2}
@keyframes footTap{
  0%,100%{transform:translateY(0)}
  40%{transform:translateY(-6px)}
  60%{transform:translateY(0)}
}
.art.anim-toe #footLeftG{transform-origin:20% 50%;animation:toeWiggle 1s ease-in-out 2}
@keyframes toeWiggle{
  0%,100%{transform:rotate(0)}
  25%{transform:rotate(-5deg)}
  50%{transform:rotate(4deg)}
  75%{transform:rotate(-2deg)}
}
.art.anim-bottom #shortsG{animation:shortsPulse 1.4s ease-in-out 2}
@keyframes shortsPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}
.art.anim-between #betweenShield{animation:guardPulse 1.6s ease-in-out 2}
@keyframes guardPulse{
  0%,100%{transform:scale(1);opacity:.55}
  50%{transform:scale(1.08);opacity:1}
}

/* small companion */
.art-sm{
  position:absolute;
  right:12%;
  top:16%;
  font-size:44px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(40,80,58,.16));
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:5;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(24px,7vw,30px)}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="prog" id="prog">1 / 16</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="glow"></div>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">🦟</div>
      <div class="art-sm" id="artSm" data-label="mosquito" hidden>🦟</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta">
      <span class="w" id="mWord">mosquito</span>
      <span class="ipa" id="mIpa">/məˈskiːtoʊ/</span>
      <span class="cn" id="mCn">蚊子</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="slow" aria-pressed="false">🐢 慢速</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

    { word:"bite",               ipa:"/baɪt/",                cn:"叮；咬",           art:"😖", scale:.95, color:"#E5484D", ink:"#B0272D", anim:"bite",  fx:["💢","🦟","✨"], small:"🦟", smallLabel:"mosquito" },
    { word:"body",               ipa:"/ˈbɑːdi/",              cn:"身体",             part:"body",     chip:"👤", color:"#4C9A7A", ink:"#2E7458", anim:"body",      fx:["✨","👤","💚"] },
    { word:"head",               ipa:"/hed/",                 cn:"头",               part:"head",     chip:"🙂", face:true, color:"#E59A2F", ink:"#9A6200", anim:"head",      fx:["✨","🙂","💫"] },
    { word:"nose",               ipa:"/noʊz/",                cn:"鼻子",             part:"nose",     chip:"👃", face:true, color:"#E2718E", ink:"#AD3D5B", anim:"nose",      fx:["✨","👃","💗"] },
    { word:"chin",               ipa:"/tʃɪn/",                cn:"下巴",             part:"chin",     chip:"😊", face:true, color:"#C9794A", ink:"#8E4B24", anim:"chin",      fx:["✨","😊","💫"] },
    { word:"shoulder",           ipa:"/ˈʃoʊldər/",            cn:"肩膀",             part:"shoulder", chip:"🤷", color:"#4F8FD8", ink:"#2A609E", anim:"shoulder",  fx:["✨","🤷","💙"] },
    { word:"arm",                ipa:"/ɑːrm/",                cn:"手臂",             part:"arm",      chip:"💪", color:"#E57A3C", ink:"#A94E18", anim:"arm",       fx:["✨","💪","💫"] },
    { word:"hand",               ipa:"/hænd/",                cn:"手",               part:"hand",     chip:"✋", color:"#D65C8E", ink:"#A33462", anim:"hand",      fx:["✨","✋","💗"] },
    { word:"knee",               ipa:"/niː/",                 cn:"膝盖",             part:"knee",     chip:"🦵", color:"#8A6ED6", ink:"#5944A4", anim:"knee",      fx:["✨","🦵","💜"] },
    { word:"feet",               ipa:"/fiːt/",                cn:"脚（复数）",       part:"feet",     chip:"🦶", color:"#2F9FB8", ink:"#16738A", anim:"feet",      fx:["✨","🦶","💧"] },
    { word:"toe",                ipa:"/toʊ/",                 cn:"脚趾",             part:"toe",      chip:"🦶", color:"#D9A227", ink:"#8F6600", anim:"toe",       fx:["✨","🦶","💛"] },
    { word:"blood",              ipa:"/blʌd/",                cn:"血",               art:"🩸", scale:.95, color:"#C62828", ink:"#981B1B", anim:"drip",  fx:["🩸","💧","✨"] },
    { word:"bottom",             ipa:"/ˈbɑːtəm/",             cn:"屁股（隐私部位）", part:"bottom",   chip:"🩲", color:"#8E5BA6", ink:"#653B7A", anim:"bottom",    fx:["✨","🛡️","💜"], back:true },
    { word:"between our legs",   ipa:"/bɪˈtwiːn aʊər leɡz/",  cn:"两腿之间（隐私部位）", part:"between", chip:"🛡️", color:"#B0455E", ink:"#832B42", anim:"between", fx:["🛡️","✨","💗"] },
    { word:"trusted adult",      ipa:"/ˈtrʌstɪd ˈædʌlt/",     cn:"可信任的成年人",   art:"🧑‍🤝‍🧑", scale:.92, color:"#3F8F6B", ink:"#256B4C", anim:"trust", fx:["💚","🤝","✨"] }
  ];

  var HIGHLIGHTS = {
    body:     '<ellipse class="ring" cx="60" cy="105" rx="39" ry="86"/>',
    shoulder: '<circle class="ring" cx="43" cy="70" r="13"/>',
    arm:      '<circle class="ring" cx="37" cy="90" r="11"/>',
    hand:     '<circle class="ring" cx="31" cy="117" r="12"/>',
    knee:     '<circle class="ring" cx="53" cy="153" r="11"/>',
    feet:     '<ellipse class="ring" cx="51" cy="184" rx="15" ry="9"/>',
    toe:      '<circle class="ring" cx="42" cy="184" r="7"/>',
    bottom:   '<rect class="ring" x="44" y="108" width="32" height="27" rx="9"/>',
    between:  '<g id="betweenShield"><path class="shield" d="M60 110 l11 5 v9 c0 8 -11 14 -11 14 s-11 -6 -11 -14 v-9 z"/></g>'
  };

  var FACE_HIGHLIGHTS = {
    head: '<circle class="ring" cx="80" cy="85" r="61"/>',
    nose: '<ellipse class="ring" cx="80" cy="94" rx="14" ry="11"/>',
    chin: '<path class="ring" d="M56 128 Q80 146 104 128"/>'
  };

  function faceSvg(part){
    return '<svg class="figure face-figure" viewBox="0 0 160 180" aria-hidden="true">' +
      '<g id="headG">' +
        '<circle class="skin" cx="23" cy="88" r="11"/>' +
        '<circle class="skin" cx="137" cy="88" r="11"/>' +
        '<circle class="skin" cx="80" cy="85" r="58"/>' +
        '<path class="hair" d="M22 84 C22 38 44 20 80 20 C116 20 138 38 138 84 C138 58 120 48 80 48 C40 48 22 58 22 84 Z"/>' +
        '<circle class="eye" cx="60" cy="80" r="4.5"/>' +
        '<circle class="eye" cx="100" cy="80" r="4.5"/>' +
        '<path class="line" d="M80 84 q5 8 0 11 q-4 1 -6 -1" stroke-width="3"/>' +
        '<path class="smile" d="M60 112 Q80 126 100 112" stroke-width="3.5"/>' +
        '<circle class="blush" cx="47" cy="101" r="7"/>' +
        '<circle class="blush" cx="113" cy="101" r="7"/>' +
        (FACE_HIGHLIGHTS[part] || "") +
      '</g>' +
    '</svg>';
  }

  function bodySvg(part, back){
    var hair = back
      ? '<path class="hair" d="M38 41 C38 12 47 6 60 6 C73 6 82 12 82 41 C82 51 74 57 60 57 C46 57 38 51 38 41 Z"/>' +
        '<path d="M60 9 v46" stroke="rgba(255,255,255,.12)" stroke-width="2" stroke-linecap="round"/>'
      : '<path class="hair" d="M39 36 C39 15 48 7 60 7 C72 7 81 15 81 36 C81 27 74 22 60 22 C46 22 39 27 39 36 Z"/>';

    var face = back ? "" :
      '<circle class="eye" cx="52" cy="34" r="1.8"/>' +
      '<circle class="eye" cx="68" cy="34" r="1.8"/>' +
      '<path class="line" d="M60 37 q2 3 0 5"/>' +
      '<path class="smile" d="M54 43 Q60 48 66 43"/>';

    var spot = HIGHLIGHTS[part] || "";

    return '<svg class="figure" viewBox="0 0 120 210" aria-hidden="true">' +
      '<g id="figure">' +
        '<g id="legRightG">' +
          '<path class="leg" d="M66 128 L68 177"/>' +
          '<g id="footRightG"><ellipse class="shoe" cx="69" cy="184" rx="12" ry="6"/></g>' +
        '</g>' +
        '<g id="legLeftG">' +
          '<path class="leg" d="M54 128 L52 177"/>' +
          '<g id="footLeftG">' +
            '<ellipse class="shoe" cx="51" cy="184" rx="12" ry="6"/>' +
            (part === "feet" || part === "toe" ? spot : "") +
          '</g>' +
          (part === "knee" ? spot : "") +
        '</g>' +
        '<g id="shortsG">' +
          '<rect class="shorts" x="42" y="106" width="36" height="31" rx="10"/>' +
          '<path d="M60 110 v26" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round"/>' +
          (part === "bottom" || part === "between" ? spot : "") +
        '</g>' +
        '<g id="torsoG">' +
          '<rect class="shirt" x="42" y="60" width="36" height="52" rx="13"/>' +
          '<path class="heart" d="M60 73c-3-6-12-2-9 4 2 4 9 8 9 8s7-4 9-8c3-6-6-10-9-4z"/>' +
          (part === "shoulder" ? spot : "") +
        '</g>' +
        '<g id="armLeftG">' +
          '<path class="arm" d="M43 70 L32 111"/>' +
          '<g id="handLeftG">' +
            '<circle class="skin" cx="31" cy="117" r="7"/>' +
            (part === "hand" ? spot : "") +
          '</g>' +
          (part === "arm" ? spot : "") +
        '</g>' +
        '<g id="armRightG">' +
          '<path class="arm" d="M77 70 L88 111"/>' +
          '<g id="handRightG"><circle class="skin" cx="89" cy="117" r="7"/></g>' +
        '</g>' +
        '<rect class="skin" x="55" y="52" width="10" height="12" rx="4"/>' +
        '<g id="headG">' +
          '<circle class="skin" cx="60" cy="36" r="21"/>' +
          hair + face +
        '</g>' +
        (part === "body" ? spot : "") +
      '</g>' +
    '</svg>';
  }

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, slow = false, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  var audio = new Audio();
  audio.preload = "auto";

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  function cancelSpeech(){
    try{ audio.pause(); }catch(e){}
    audio.onended = null;
    audio.onerror = null;
    try{ audio.currentTime = 0; }catch(e){}
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    audio.src = audioUrl(L.word);
    audio.playbackRate = slow ? 0.72 : 1;
    audio.onended = function(){ if(wordActive) finishWord(); };
    audio.onerror = function(){ if(wordActive) finishWord(); };
    var p = audio.play();
    if(p && p.catch){
      p.catch(function(err){
        if(err && err.name === "AbortError") return;
        if(wordActive) finishWord();
      });
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-ink", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    if(L.part){
      elArt.innerHTML = L.face ? faceSvg(L.part) : bodySvg(L.part, L.back);
    } else {
      elArt.textContent = L.art;
    }
    elArt.setAttribute("aria-label", L.word + "，点击朗读");

    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) setTimeout(function(){ if(!wordActive) readWord(); }, 380);
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setSlow(v){
    slow = v;
    $("slow").setAttribute("aria-pressed", v ? "true" : "false");
  }
  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("slow").addEventListener("click", function(){ dismissCoach(); setSlow(!slow); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
