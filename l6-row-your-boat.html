/* ── Design plan ────────────────────────────────────────────────
   Subject: 17 words that are one journey — push off in a little
            boat, drift gently down a jungle stream, then meet the
            animals calling from the bank. The stage emoji is the
            thing a word names (or the sound it makes); a small
            companion keeps the traveller present when the stage is
            a feather, a wave, a moon or a thought bubble.
   Color  : pale river-mist ground + forest-biased ink; the accent
            re-tints at every stop — river teal, canoe wood, leaf,
            water blue, sun gold, dusk violet, crocodile green,
            misty mauve, alarm coral, roar orange, mouse grey,
            squeak pink, emerald, deep jungle, twilight, hare tan,
            squirrel rust — so the rail reads as a journey.
   Type   : Baloo 2 (rounded display: word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, river stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#F3F8EE;
  --bg-glow:#DDEFD0;
  --surface:#FFFDF6;
  --surface-2:#EDF5E5;
  --ink:#203127;
  --ink-soft:#708574;
  --line:#D8E5D2;
  --accent:#2F9E8F;
  --accent-deep:#176E62;
  --accent-ink:var(--accent-deep);
  --accent-soft:rgba(47,158,143,.16);
  --shadow:0 20px 44px -22px rgba(36,82,54,.35), 0 2px 6px rgba(36,82,54,.06);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1713;
    --bg-glow:#16291E;
    --surface:#18231C;
    --surface-2:#1F2D24;
    --ink:#EEF7E9;
    --ink-soft:#9DB3A2;
    --line:#2C3E31;
    --accent-ink:var(--accent);
    --accent-soft:rgba(47,158,143,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .btn.primary,
  :root:not([data-theme="light"]) .coach{color:#0B1410}
}
:root[data-theme="dark"]{
  --bg:#0F1713;
  --bg-glow:#16291E;
  --surface:#18231C;
  --surface-2:#1F2D24;
  --ink:#EEF7E9;
  --ink-soft:#9DB3A2;
  --line:#2C3E31;
  --accent-ink:var(--accent);
  --accent-soft:rgba(47,158,143,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .coach{color:#0B1410}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* river stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(148px,25vh,202px);
  isolation:isolate;
}
.glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.18;
  filter:blur(40px);
  transition:background .3s ease;
  z-index:0;
}
.river{
  position:absolute;
  left:-10%;right:-10%;bottom:0;
  height:62px;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}
.river span{
  position:absolute;
  left:-5%;
  width:110%;
  height:38px;
  border-radius:50%;
  background:var(--accent-soft);
  filter:blur(1px);
  transition:background .3s ease;
}
.river span:nth-child(1){top:15px;animation:riverA 7s ease-in-out infinite alternate}
.river span:nth-child(2){top:31px;opacity:.72;animation:riverB 9s ease-in-out infinite alternate}
@keyframes riverA{from{transform:translateX(-2%) scaleX(1)}to{transform:translateX(3%) scaleX(1.04)}}
@keyframes riverB{from{transform:translateX(2%) scaleX(1.03)}to{transform:translateX(-3%) scaleX(1)}}

.art{
  position:relative;
  z-index:2;
  font-size:calc(clamp(74px,19vw,118px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(32,66,45,.22));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(32,66,45,.3))}
.art-sm{
  position:absolute;
  right:12%;
  bottom:11%;
  z-index:3;
  font-size:40px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(32,66,45,.18));
  animation:companionFloat 3.2s ease-in-out infinite;
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}
@keyframes companionFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

/* one motion per stop: rowing, bobbing, floating, flowing, singing,
   dozing, a crocodile snap, a memory fading, a scream, a roar,
   a scurry, a squeak, a slither, jungle sway, an owl hoot,
   a hare hop, a squirrel nibble */
.art.anim-row{transform-origin:50% 86%;animation:rowStroke 1.35s cubic-bezier(.4,0,.2,1) 2}
@keyframes rowStroke{
  0%,100%{transform:rotate(0) translate(0,0)}
  12%{transform:rotate(-8deg) translate(-7px,2px)}
  34%{transform:rotate(7deg) translate(8px,-1px)}
  56%{transform:rotate(-6deg) translate(-5px,1px)}
  76%{transform:rotate(4deg) translate(3px,0)}
  88%{transform:rotate(-2deg)}
}
.art.anim-bob{animation:boatBob 1.6s ease-in-out 2}
@keyframes boatBob{
  0%,100%{transform:translateY(2px) rotate(-1.5deg)}
  40%{transform:translateY(-11px) rotate(1.5deg)}
  65%{transform:translateY(-4px) rotate(.5deg)}
}
.art.anim-float{animation:featherFloat 2.4s ease-in-out 2}
@keyframes featherFloat{
  0%,100%{transform:translate(0,0) rotate(-4deg) scale(1)}
  30%{transform:translate(8px,-12px) rotate(5deg) scale(1.02)}
  60%{transform:translate(-6px,-18px) rotate(-3deg)}
  80%{transform:translate(-10px,-6px) rotate(2deg)}
}
.art.anim-flow{animation:streamFlow 1.8s ease-in-out 2}
@keyframes streamFlow{
  0%,100%{transform:translateX(0) skewX(0)}
  25%{transform:translateX(-12px) skewX(-5deg)}
  50%{transform:translateX(4px) skewX(3deg)}
  75%{transform:translateX(14px) skewX(-2deg)}
}
.art.anim-bop{animation:merryBop 1.05s ease-in-out 2}
@keyframes merryBop{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  25%{transform:translateY(-17px) rotate(3deg) scale(1.06)}
  50%{transform:translateY(2px) rotate(-1deg) scale(.97)}
  70%{transform:translateY(-7px) rotate(1deg)}
  85%{transform:translateY(0)}
}
.art.anim-doze{animation:moonDoze 2.2s ease-in-out 2}
@keyframes moonDoze{
  0%,100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}
  50%{opacity:.65;transform:translateY(11px) rotate(-7deg) scale(.93)}
  78%{opacity:.9;transform:translateY(3px) rotate(-2deg)}
}
.art.anim-snap{animation:crocSnap 1.1s cubic-bezier(.3,1.1,.4,1) 3}
@keyframes crocSnap{
  0%,100%{transform:scale(1,1) rotate(0)}
  16%{transform:scale(1.12,.82) rotate(-4deg)}
  28%{transform:scale(1) rotate(0)}
  46%{transform:scale(1.1,.86) rotate(3deg)}
  58%{transform:scale(1)}
  74%{transform:scale(1.07,.9) rotate(-2deg)}
  86%{transform:scale(1)}
}
.art.anim-fade{animation:forgetFade 2.1s ease-in-out 2}
@keyframes forgetFade{
  0%,100%{opacity:1;transform:scale(1) rotate(0) translateY(0)}
  32%{opacity:.18;transform:scale(.78) rotate(-7deg) translateY(8px)}
  55%{opacity:.18;transform:scale(.78) rotate(-7deg) translateY(8px)}
  78%{opacity:.8;transform:scale(.94) rotate(2deg)}
}
.art.anim-shriek{animation:shriekShake 1.2s ease-in-out 2}
@keyframes shriekShake{
  0%,100%{transform:translate(0,0) scale(1) rotate(0)}
  8%{transform:translate(-5px,2px) scale(1.1) rotate(-3deg)}
  16%{transform:translate(5px,-2px) scale(1.1) rotate(3deg)}
  24%{transform:translate(-6px,1px) scale(1.06) rotate(-4deg)}
  32%{transform:translate(6px,-1px) scale(1.06) rotate(4deg)}
  40%{transform:translate(-4px,2px) scale(1.03) rotate(-2deg)}
  48%{transform:translate(4px,0) scale(1.03) rotate(2deg)}
  60%{transform:translate(0,0) scale(1.03)}
  80%{transform:scale(.99)}
}
.art.anim-roar{animation:roarBurst 1.5s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes roarBurst{
  0%,100%{transform:scale(1) rotate(0)}
  20%{transform:scale(1.28) rotate(-6deg)}
  36%{transform:scale(1.08) rotate(4deg)}
  52%{transform:scale(1.22) rotate(-3deg)}
  68%{transform:scale(1.04) rotate(1deg)}
}
.art.anim-scurry{animation:mouseScurry 1.05s cubic-bezier(.3,1.1,.4,1) 3}
@keyframes mouseScurry{
  0%,100%{transform:translate(0,0) scale(1,1) rotate(0)}
  18%{transform:translate(-30px,3px) scale(1.04,.94) rotate(-4deg)}
  38%{transform:translate(16px,-3px) scale(.96,1.04) rotate(3deg)}
  58%{transform:translate(-18px,2px) scale(1.02,.98) rotate(-2deg)}
  76%{transform:translate(9px,-1px) rotate(1deg)}
  88%{transform:translate(-3px,0)}
}
.art.anim-squeak{animation:squeakJitter 1s linear 3}
@keyframes squeakJitter{
  0%,100%{transform:translate(0,0) rotate(0) scale(1)}
  8%{transform:translate(-3px,1px) rotate(-1deg) scale(1.04)}
  16%{transform:translate(3px,-1px) rotate(1deg) scale(1.02)}
  24%{transform:translate(-2px,0) rotate(-1deg)}
  32%{transform:translate(2px,1px) rotate(1deg)}
  40%{transform:translate(0,0)}
  55%{transform:scale(1.1)}
  70%{transform:scale(1)}
}
.art.anim-slither{animation:snakeSlither 1.6s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes snakeSlither{
  0%,100%{transform:translateX(0) translateY(0) rotate(0) scaleX(1)}
  20%{transform:translateX(-30px) translateY(4px) rotate(-6deg) scaleX(.92)}
  45%{transform:translateX(4px) translateY(-5px) rotate(5deg) scaleX(1.08)}
  70%{transform:translateX(32px) translateY(4px) rotate(-4deg) scaleX(.96)}
  86%{transform:translateX(0) translateY(1px)}
}
.art.anim-sway{animation:jungleSway 2.1s ease-in-out 2}
@keyframes jungleSway{
  0%,100%{transform:rotate(-2deg) translateY(0) scale(1)}
  50%{transform:rotate(3deg) translateY(-5px) scale(1.04)}
}
.art.anim-hoot{animation:owlHoot 1.4s ease-in-out 2}
@keyframes owlHoot{
  0%,100%{transform:translateY(0) rotate(0) scale(1)}
  20%{transform:translateY(-4px) rotate(-7deg) scale(1.05)}
  40%{transform:translateY(-2px) rotate(6deg) scale(1.02)}
  58%{transform:rotate(-3deg) scale(1.01)}
  74%{transform:translateY(-3px) rotate(5deg) scale(1.07)}
  88%{transform:rotate(-1deg) scale(1)}
}
.art.anim-hop{animation:hareHop 1.15s cubic-bezier(.3,1.2,.4,1) 3}
@keyframes hareHop{
  0%,100%{transform:translateY(0) scale(1,1)}
  10%{transform:translateY(0) scale(1.1,.88)}
  28%{transform:translateY(-28px) scale(.94,1.08)}
  46%{transform:translateY(0) scale(1.08,.92)}
  58%{transform:translateY(-12px) scale(.98,1.02)}
  72%{transform:translateY(0) scale(1.03,.97)}
  84%{transform:translateY(0) scale(1)}
}
.art.anim-nibble{animation:squirrelNibble .95s ease-in-out 3}
@keyframes squirrelNibble{
  0%,100%{transform:translateY(0) rotate(0) scale(1,1)}
  18%{transform:translateY(1px) rotate(-5deg) scale(.985,1.015)}
  36%{transform:translateY(0) rotate(3deg) scale(1.01,.99)}
  54%{transform:translateY(-2px) rotate(-4deg) scale(.99,1.01)}
  72%{transform:translateY(0) rotate(2deg)}
}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:5;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(24px,7vw,30px)}
  .art-sm{right:9%;font-size:34px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="prog" id="prog">1 / 17</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="glow"></div>
      <div class="river" aria-hidden="true"><span></span><span></span></div>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">🚣</div>
      <div class="art-sm" id="artSm" data-label="boat" hidden>🛶</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta" aria-live="polite">
      <span class="w" id="mWord">row</span>
      <span class="ipa" id="mIpa">/roʊ/</span>
      <span class="cn" id="mCn">划（船）</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="slow" aria-pressed="false">🐢 慢速</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"row",       ipa:"/roʊ/",             cn:"划（船）",       art:"🚣",  scale:1.02, color:"#2F9E8F", ink:"#176E62", anim:"row",     fx:["💧","🌊","✨"] },
    { word:"boat",      ipa:"/boʊt/",            cn:"小船",           art:"🛶",  scale:1,    color:"#D9862D", ink:"#905614", anim:"bob",     fx:["💧","🍃","✨"] },
    { word:"gently",    ipa:"/ˈdʒentli/",        cn:"轻轻地；温柔地", art:"🪶",  scale:.9,   color:"#7BAF6B", ink:"#4B7C3A", anim:"float",   fx:["🍃","💨","✨"], small:"🛶", smallLabel:"boat" },
    { word:"stream",    ipa:"/striːm/",          cn:"小溪；溪流",     art:"🌊",  scale:1,    color:"#3C9CC9", ink:"#1E6D91", anim:"flow",    fx:["💧","🌊","✨"], small:"🛶", smallLabel:"boat" },
    { word:"merrily",   ipa:"/ˈmerəli/",         cn:"欢快地",         art:"🎶",  scale:1,    color:"#E0A51F", ink:"#8D6400", anim:"bop",     fx:["🎵","🎶","✨"], small:"🛶", smallLabel:"boat" },
    { word:"dream",     ipa:"/driːm/",           cn:"梦；梦想",       art:"🌙",  scale:.95,  color:"#7C6BC9", ink:"#4E3E9E", anim:"doze",    fx:["💤","🌙","✨"], small:"🛶", smallLabel:"boat" },
    { word:"crocodile", ipa:"/ˈkrɑːkədaɪl/",     cn:"鳄鱼",           art:"🐊",  scale:1,    color:"#5F9E3F", ink:"#3B6B24", anim:"snap",    fx:["💥","💧","✨"] },
    { word:"forget",    ipa:"/fərˈɡet/",         cn:"忘记",           art:"💭",  scale:1,    color:"#9A86A8", ink:"#6B5579", anim:"fade",    fx:["❓","💭","✨"], small:"🐊", smallLabel:"crocodile" },
    { word:"scream",    ipa:"/skriːm/",          cn:"尖叫",           art:"😱",  scale:1,    color:"#E2574C", ink:"#A82E26", anim:"shriek",  fx:["❗","💥","💨"], small:"🐭", smallLabel:"mouse" },
    { word:"roar",      ipa:"/rɔːr/",            cn:"吼叫；咆哮",     art:"📢",  scale:1,    color:"#E07A2C", ink:"#9D4D0B", anim:"roar",    fx:["💥","〰️","🔥"], small:"🐊", smallLabel:"crocodile" },
    { word:"mouse",     ipa:"/maʊs/",            cn:"老鼠",           art:"🐭",  scale:.95,  color:"#8E8E93", ink:"#57575E", anim:"scurry",  fx:["🐾","✨","🌿"] },
    { word:"squeak",    ipa:"/skwiːk/",          cn:"吱吱叫",         art:"🐭",  scale:.95,  color:"#D9779A", ink:"#A03E60", anim:"squeak",  fx:["🎵","💬","❗"] },
    { word:"snake",     ipa:"/sneɪk/",           cn:"蛇",             art:"🐍",  scale:1,    color:"#3D9E62", ink:"#1F6B3C", anim:"slither", fx:["🌿","✨","💨"] },
    { word:"jungle",    ipa:"/ˈdʒʌŋɡl/",         cn:"丛林",           art:"🌴",  scale:1,    color:"#2F7D4F", ink:"#18542F", anim:"sway",    fx:["🍃","🌿","✨"] },
    { word:"owl",       ipa:"/aʊl/",             cn:"猫头鹰",         art:"🦉",  scale:1,    color:"#6B6FA8", ink:"#43477A", anim:"hoot",    fx:["🎵","🌙","✨"] },
    { word:"hare",      ipa:"/her/",             cn:"野兔",           art:"🐇",  scale:1,    color:"#B58A5E", ink:"#7F5A32", anim:"hop",     fx:["🌿","✨","💨"] },
    { word:"squirrel",  ipa:"/ˈskwɜːrəl/",       cn:"松鼠",           art:"🐿️", scale:.95,  color:"#C1683D", ink:"#8A3F1D", anim:"nibble",  fx:["🌰","🍃","✨"] }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, slow = false, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  var audio = new Audio();
  audio.preload = "auto";

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  // 用 fetch 预取本课全部音频并存成 Blob，点击时直接播放本地数据，不再等待网络
  // （iOS Safari 会忽略 Audio 的 preload，fetch 不受自动播放策略限制）
  var blobUrls = {};
  if(window.fetch){
    LESSONS.forEach(function(L){
      var url = audioUrl(L.word);
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.blob();
      }).then(function(b){
        blobUrls[url] = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
      }).catch(function(){});
    });
  }

  function cancelSpeech(){
    try{ audio.pause(); }catch(e){}
    audio.onended = null;
    audio.onerror = null;
    try{ audio.currentTime = 0; }catch(e){}
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    var url = audioUrl(L.word);
    audio.src = blobUrls[url] || url;
    audio.playbackRate = slow ? 0.72 : 1;
    audio.onended = function(){ if(wordActive) finishWord(); };
    audio.onerror = function(){ if(wordActive) finishWord(); };
    var p = audio.play();
    if(p && p.catch){
      p.catch(function(err){
        if(err && err.name === "AbortError") return;
        if(wordActive) finishWord();
      });
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-deep", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    elArt.textContent = L.art;
    elArt.setAttribute("aria-label", "点击朗读 " + L.word);
    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) readWord();
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setSlow(v){
    slow = v;
    $("slow").setAttribute("aria-pressed", v ? "true" : "false");
  }
  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("slow").addEventListener("click", function(){ dismissCoach(); setSlow(!slow); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
