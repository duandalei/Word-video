/* ── Design plan ────────────────────────────────────────────────
   Subject: 22 words from "I'm a little farmer" — working hard,
            feeding the animals, milking, collecting eggs, picking
            vegetables, harvesting, and the fresh produce that ends
            up in the basket.
   Color  : late-afternoon field — oat paper, soil brown, barn red,
            hay gold and crop green. The accent re-tints at every
            stop, from the farmyard to the vegetable patch.
   Type   : Baloo 2 (rounded display: word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, field stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#FAF4E5;
  --bg-glow:#F3E3BE;
  --surface:#FFFDF6;
  --surface-2:#F6EEDC;
  --ink:#33291E;
  --ink-soft:#8A7A63;
  --line:#E7DCC7;
  --accent:#C1683D;
  --accent-deep:#8A3F1D;
  --accent-ink:var(--accent-deep);
  --accent-soft:rgba(193,104,61,.16);
  --shadow:0 20px 44px -22px rgba(92,60,30,.35), 0 2px 6px rgba(92,60,30,.06);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17130F;
    --bg-glow:#2A2116;
    --surface:#211B15;
    --surface-2:#2B241B;
    --ink:#F7EEDD;
    --ink-soft:#B3A48E;
    --line:#3B3126;
    --accent-ink:var(--accent);
    --accent-soft:rgba(193,104,61,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .btn.primary,
  :root:not([data-theme="light"]) .coach{color:#17130F}
}
:root[data-theme="dark"]{
  --bg:#17130F;
  --bg-glow:#2A2116;
  --surface:#211B15;
  --surface-2:#2B241B;
  --ink:#F7EEDD;
  --ink-soft:#B3A48E;
  --line:#3B3126;
  --accent-ink:var(--accent);
  --accent-soft:rgba(193,104,61,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .coach{color:#17130F}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}
.audio-status{
  margin-right:auto;
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
  padding:3px 10px 3px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  opacity:0;
  transform:translateY(-2px);
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
}
.audio-status.on{opacity:1;transform:none}
.audio-status.done{opacity:0;transform:translateY(-4px)}
.audio-status i{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:audioPulse 1s ease-in-out infinite;
}
@keyframes audioPulse{
  0%,100%{opacity:.35;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* field stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(156px,26vh,212px);
  isolation:isolate;
}
.glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.18;
  filter:blur(40px);
  transition:background .3s ease;
  z-index:0;
}
.sun{
  position:absolute;
  top:10px;right:13%;
  width:46px;height:46px;
  border-radius:50%;
  background:#F1C24E;
  box-shadow:0 0 0 10px rgba(241,194,78,.18), 0 12px 24px rgba(130,99,32,.12);
  opacity:.85;
  z-index:1;
}
.field{
  position:absolute;
  left:-10%;right:-10%;bottom:0;
  height:78px;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}
.field span{
  position:absolute;
  left:-4%;
  width:108%;
  height:24px;
  border-radius:50%;
  background:var(--accent-soft);
  filter:blur(1px);
  transition:background .3s ease;
}
.field span:nth-child(1){bottom:2px;opacity:.8;animation:fieldA 8s ease-in-out infinite alternate}
.field span:nth-child(2){bottom:22px;left:2%;width:100%;opacity:.55;animation:fieldB 10s ease-in-out infinite alternate}
.field span:nth-child(3){bottom:44px;left:6%;width:92%;opacity:.34;animation:fieldA 7s ease-in-out infinite alternate-reverse}
@keyframes fieldA{from{transform:translateX(-2%) scaleX(1)}to{transform:translateX(3%) scaleX(1.03)}}
@keyframes fieldB{from{transform:translateX(2%) scaleX(1.02)}to{transform:translateX(-3%) scaleX(1)}}
.crop{
  position:absolute;
  bottom:24px;
  z-index:2;
  font-size:26px;
  line-height:1;
  opacity:.7;
  filter:drop-shadow(0 6px 8px rgba(92,60,30,.12));
  animation:cropSway 4.5s ease-in-out infinite alternate;
  pointer-events:none;
}
.crop.l{left:5%;transform-origin:50% 100%}
@keyframes cropSway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}

.art{
  position:relative;
  z-index:3;
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:calc(clamp(74px,19vw,118px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(92,60,30,.22));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(92,60,30,.3))}
.art-sm{
  position:absolute;
  right:12%;
  bottom:11%;
  z-index:4;
  font-size:40px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(92,60,30,.18));
  animation:companionFloat 3.2s ease-in-out infinite;
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}
@keyframes companionFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

/* one motion per stop: work, feed, gather, milk, eggs, pick,
   harvest, a new day, pour, cluck, and one texture per crop */
.art.anim-work{animation:workPump 1.1s ease-in-out 2}
@keyframes workPump{
  0%,100%{transform:translateY(0) scale(1,1)}
  15%{transform:translateY(6px) scale(1.08,.9)}
  35%{transform:translateY(-14px) scale(.94,1.1)}
  50%{transform:translateY(0) scale(1.05,.95)}
  65%{transform:translateY(-10px) scale(.97,1.05)}
  80%{transform:translateY(0) scale(1.01,.99)}
}
.art.anim-feed{animation:feedToss 1.35s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes feedToss{
  0%,100%{transform:rotate(0) translate(0,0)}
  25%{transform:rotate(-10deg) translate(-8px,-6px)}
  50%{transform:rotate(12deg) translate(10px,-2px)}
  70%{transform:rotate(-6deg) translate(-5px,-4px)}
  85%{transform:rotate(3deg) translate(2px,-1px)}
}
.art.anim-herd{animation:herdGather 1.8s ease-in-out 2}
@keyframes herdGather{
  0%,100%{transform:scale(1) translateY(0)}
  30%{transform:scale(1.06) translateY(-6px)}
  60%{transform:scale(.97) translateY(2px)}
  80%{transform:scale(1.02) translateY(-2px)}
}
.art.anim-milk{animation:milkSqueeze 1.15s ease-in-out 2}
@keyframes milkSqueeze{
  0%,100%{transform:scale(1,1)}
  20%{transform:scale(.86,1.12)}
  40%{transform:scale(1.1,.92)}
  60%{transform:scale(.92,1.06)}
  80%{transform:scale(1.03,.98)}
}
.art.anim-eggs{animation:eggBob 1.2s ease-in-out 2}
@keyframes eggBob{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(0,-12px) rotate(-6deg)}
  45%{transform:translate(8px,0) rotate(5deg)}
  70%{transform:translate(-4px,-6px) rotate(-3deg)}
  85%{transform:translate(0,0)}
}
.art.anim-pick{animation:pickReach 1.2s ease-in-out 2}
@keyframes pickReach{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-16px) rotate(-4deg)}
  55%{transform:translateY(7px) rotate(3deg)}
  75%{transform:translateY(-6px) rotate(-1deg)}
}
.art.anim-harvest{animation:harvestSwing 1.4s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes harvestSwing{
  0%,100%{transform:rotate(0) translate(0,0)}
  20%{transform:rotate(-14deg) translate(-10px,2px)}
  55%{transform:rotate(16deg) translate(10px,-4px)}
  80%{transform:rotate(-4deg)}
}
.art.anim-sunrise{animation:farmSunrise 1.7s cubic-bezier(.25,1.1,.4,1) 2}
@keyframes farmSunrise{
  0%{transform:translateY(24px) scale(.9);opacity:.35}
  45%{transform:translateY(-10px) scale(1.06);opacity:1}
  70%{transform:translateY(0) scale(1)}
  100%{transform:none;opacity:1}
}
.art.anim-pour{animation:milkPour 1.3s ease-in-out 2}
@keyframes milkPour{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-12deg) translate(-6px,0)}
  45%{transform:rotate(10deg) translate(6px,2px)}
  70%{transform:rotate(-5deg)}
  85%{transform:rotate(2deg)}
}
.art.anim-cluck{animation:henCluck 1.05s ease-in-out 2}
@keyframes henCluck{
  0%,100%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(-8px) rotate(-5deg)}
  40%{transform:translateY(0) rotate(3deg)}
  55%{transform:translateY(-5px) rotate(-2deg)}
  70%{transform:translateY(0) rotate(0)}
}
.art.anim-squash{animation:cropSquash 1.15s ease-in-out 2}
@keyframes cropSquash{
  0%,100%{transform:scale(1,1)}
  20%{transform:scale(1.14,.82)}
  45%{transform:scale(.92,1.12)}
  65%{transform:scale(1.06,.95)}
  80%{transform:scale(.98,1.02)}
}
.art.anim-leafy{animation:leafySway 2s ease-in-out 2}
@keyframes leafySway{
  0%,100%{transform:rotate(-5deg) translateY(0)}
  35%{transform:rotate(5deg) translateY(-6px)}
  65%{transform:rotate(-3deg) translateY(-2px)}
  85%{transform:rotate(3deg)}
}
.art.anim-crunch{animation:crunchChomp 1.05s ease-in-out 2}
@keyframes crunchChomp{
  0%,100%{transform:scale(1)}
  18%{transform:scale(1.1,.86)}
  36%{transform:scale(.94,1.08)}
  54%{transform:scale(1.08,.9)}
  72%{transform:scale(.97,1.03)}
  86%{transform:scale(1.02,.98)}
}
.art.anim-cherry{animation:cherryBounce 1.2s cubic-bezier(.3,1.2,.4,1) 2}
@keyframes cherryBounce{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-16px) rotate(-6deg)}
  50%{transform:translateY(0) rotate(4deg)}
  68%{transform:translateY(-8px) rotate(-2deg)}
  82%{transform:translateY(0)}
}
.art.anim-shake{animation:pepperShake 1s linear 2}
@keyframes pepperShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-4px,1px) rotate(-3deg)}
  20%{transform:translate(4px,-1px) rotate(3deg)}
  30%{transform:translate(-3px,1px) rotate(-2deg)}
  40%{transform:translate(3px,-1px) rotate(2deg)}
  55%{transform:translate(0,0) rotate(0) scale(1.05)}
  70%{transform:scale(1)}
}
.art.anim-rock{animation:produceRock 2s ease-in-out 2}
@keyframes produceRock{
  0%,100%{transform:rotate(-4deg) translateY(0)}
  50%{transform:rotate(5deg) translateY(-4px)}
}
.art.anim-bounce{animation:produceBounce 1.15s cubic-bezier(.3,1.2,.4,1) 2}
@keyframes produceBounce{
  0%,100%{transform:translateY(0) scale(1,1)}
  20%{transform:translateY(0) scale(1.08,.9)}
  48%{transform:translateY(-22px) scale(.96,1.06)}
  70%{transform:translateY(0) scale(1.04,.96)}
  88%{transform:translateY(-4px) scale(1)}
}
.art.anim-spin{animation:pineSpin 1.5s ease-in-out 2}
@keyframes pineSpin{
  0%,100%{transform:rotate(0) scale(1)}
  30%{transform:rotate(-12deg) scale(1.05)}
  60%{transform:rotate(12deg) scale(1.03)}
  80%{transform:rotate(-4deg)}
}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
  max-width:100%;
  overflow-wrap:anywhere;
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:6;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:600px){
  .card{padding-bottom:52px}
  .coach{bottom:8px}
}
@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(23px,6.6vw,30px)}
  .art-sm{right:9%;font-size:34px}
  .crop{font-size:23px}
  .sun{width:38px;height:38px;right:9%}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="audio-status" id="audioStatus" aria-hidden="true"><i></i><span id="audioCount"></span></div>
    <div class="prog" id="prog">1 / 22</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="glow"></div>
      <div class="sun" aria-hidden="true"></div>
      <div class="field" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="crop l" aria-hidden="true">🌱</span>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">💪</div>
      <div class="art-sm" id="artSm" data-label="tractor" hidden>🚜</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta" aria-live="polite">
      <span class="w" id="mWord">work hard</span>
      <span class="ipa" id="mIpa">/wɜːrk hɑːrd/</span>
      <span class="cn" id="mCn">努力工作</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"work hard",                 ipa:"/wɜːrk hɑːrd/",                 cn:"努力工作",         art:"💪",            scale:1,    color:"#C1683D", ink:"#8A3F1D", anim:"work",    fx:["🌾","✨","💪"], small:"🚜", smallLabel:"tractor" },
    { word:"feed",                      ipa:"/fiːd/",                       cn:"喂养",             art:"🥣",            scale:1,    color:"#D99A2B", ink:"#8C5B0B", anim:"feed",    fx:["🌾","🐔","✨"], small:"🐔", smallLabel:"hen" },
    { word:"all the farm animals",       ipa:"/ɔːl ðə fɑːrm ˈænɪmlz/",       cn:"所有农场动物",     art:"🐄🐑🐔",        scale:.72,  color:"#6FA35A", ink:"#436B34", anim:"herd",    fx:["🐄","🐑","✨"], chip:"🐄" },
    { word:"milk the cow",               ipa:"/mɪlk ðə kaʊ/",                cn:"挤牛奶",           art:"🥛",            scale:1,    color:"#3C9CC9", ink:"#1E6D91", anim:"milk",    fx:["💧","🥛","✨"], small:"🐄", smallLabel:"cow" },
    { word:"collect the eggs",           ipa:"/kəˈlekt ði eɡz/",             cn:"捡鸡蛋",           art:"🥚",            scale:1,    color:"#D9862D", ink:"#905614", anim:"eggs",    fx:["🥚","🐔","✨"], small:"🐔", smallLabel:"hen" },
    { word:"pick the vegetables",        ipa:"/pɪk ðə ˈvedʒtəblz/",          cn:"摘蔬菜",           art:"🥬",            scale:1,    color:"#5F9E3F", ink:"#3B6B24", anim:"pick",    fx:["🥬","🧺","✨"], small:"🧺", smallLabel:"basket" },
    { word:"harvest the crop",           ipa:"/ˈhɑːrvɪst ðə krɑːp/",         cn:"收割庄稼",         art:"🌾",            scale:1,    color:"#E0A51F", ink:"#8D6400", anim:"harvest", fx:["🌾","🚜","✨"], small:"🚜", smallLabel:"tractor" },
    { word:"experience a farm's day",    ipa:"/ɪkˈspɪriəns ə fɑːrmz deɪ/",   cn:"体验农场的一天",   art:"🌅",            scale:1,    color:"#E07A2C", ink:"#9D4D0B", anim:"sunrise", fx:["🌅","🌾","✨"], small:"🚜", smallLabel:"tractor" },
    { word:"fresh milk",                 ipa:"/freʃ mɪlk/",                  cn:"鲜牛奶",           art:"🥛",            scale:1,    color:"#7C8FC9", ink:"#4A5C9C", anim:"pour",    fx:["💧","🥛","✨"] },
    { word:"a hen house",                ipa:"/ə hen haʊs/",                 cn:"鸡舍",             art:"🏠",            scale:1,    color:"#B58A5E", ink:"#7F5A32", anim:"cluck",   fx:["🐔","🥚","✨"], small:"🐔", smallLabel:"hen" },
    { word:"pumpkin",                    ipa:"/ˈpʌmpkɪn/",                  cn:"南瓜",             art:"🎃",            scale:1,    color:"#D9742B", ink:"#9B470B", anim:"squash",  fx:["🍂","✨","🌟"] },
    { word:"cabbage",                    ipa:"/ˈkæbɪdʒ/",                   cn:"卷心菜",           art:"🥬",            scale:1,    color:"#7BAF6B", ink:"#4B7C3A", anim:"leafy",   fx:["🍃","💧","✨"] },
    { word:"carrots",                    ipa:"/ˈkærəts/",                   cn:"胡萝卜",           art:"🥕",            scale:1,    color:"#E07A2C", ink:"#9D4D0B", anim:"crunch",  fx:["🥕","🍃","✨"] },
    { word:"cherry",                     ipa:"/ˈtʃeri/",                    cn:"樱桃",             art:"🍒",            scale:1,    color:"#D9779A", ink:"#A03E60", anim:"cherry",  fx:["🍒","✨","🌟"] },
    { word:"tomato",                     ipa:"/təˈmeɪtoʊ/",                 cn:"西红柿",           art:"🍅",            scale:1,    color:"#E2574C", ink:"#A82E26", anim:"squash",  fx:["🍅","💧","✨"] },
    { word:"red pepper",                 ipa:"/red ˈpepər/",                cn:"红椒",             art:"🌶️",           scale:1,    color:"#D33A2C", ink:"#8F1F16", anim:"shake",   fx:["🌶️","✨","🔥"] },
    { word:"avocado",                    ipa:"/ˌævəˈkɑːdoʊ/",               cn:"牛油果",           art:"🥑",            scale:1,    color:"#5F9E3F", ink:"#3B6B24", anim:"rock",    fx:["🥑","🍃","✨"] },
    { word:"kiwi fruit",                 ipa:"/ˈkiːwi fruːt/",              cn:"猕猴桃",           art:"🥝",            scale:1,    color:"#8FA33D", ink:"#5F6F1F", anim:"rock",    fx:["🥝","🍃","✨"] },
    { word:"celery",                     ipa:"/ˈseləri/",                   cn:"芹菜",             art:"🌿",            scale:1,    color:"#6FA35A", ink:"#436B34", anim:"leafy",   fx:["🌿","💧","✨"] },
    { word:"broccoli",                   ipa:"/ˈbrɑːkəli/",                 cn:"西兰花",           art:"🥦",            scale:1,    color:"#3D9E62", ink:"#1F6B3C", anim:"bounce",  fx:["🥦","🍃","✨"] },
    { word:"pineapple",                  ipa:"/ˈpaɪnæpl/",                  cn:"菠萝",             art:"🍍",            scale:1,    color:"#E0A51F", ink:"#8D6400", anim:"spin",    fx:["🍍","🌟","✨"] },
    { word:"corn",                       ipa:"/kɔːrn/",                     cn:"玉米",             art:"🌽",            scale:1,    color:"#E8B33A", ink:"#9A6A00", anim:"crunch",  fx:["🌽","🌾","✨"] }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  // iOS 上 HTMLAudioElement 的 play() 会同步阻塞主线程（实测约 700ms），
  // 改用 Web Audio：预先把音频解码成 AudioBuffer，点击时只启动 BufferSource。
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var ctx = AudioCtx ? new AudioCtx() : null;
  var buffers = {};    // url -> AudioBuffer
  var current = null;  // 当前正在播放的 BufferSource

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  // 用 fetch 预取本课全部音频并解码成 AudioBuffer，点击时直接启动播放，不再等待网络
  // （iOS Safari 会忽略 Audio 的 preload；HTMLAudioElement.play() 还会阻塞主线程约 0.7s）
  var elAudioStatus = $("audioStatus"), elAudioCount = $("audioCount");
  var audioTotal = LESSONS.length, audioLoaded = 0, audioStatusTimer = null;

  function audioDone(){
    clearTimeout(audioStatusTimer);
    if(elAudioStatus.classList.contains("on")){
      elAudioStatus.classList.add("done");
      setTimeout(function(){ elAudioStatus.classList.remove("on", "done"); }, 400);
    }
  }

  function audioProgress(){
    audioLoaded++;
    elAudioCount.textContent = audioLoaded + "/" + audioTotal;
    if(audioLoaded === audioTotal) audioDone();
  }

  elAudioCount.textContent = "0/" + audioTotal;

  if(window.fetch){
    // 预取超过 150ms 才显示进度，避免缓存命中时闪一下
    audioStatusTimer = setTimeout(function(){
      if(audioLoaded < audioTotal) elAudioStatus.classList.add("on");
    }, 150);
    LESSONS.forEach(function(L){
      var url = audioUrl(L.word);
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.arrayBuffer();
      }).then(function(buf){
        if(!ctx) throw new Error("no Web Audio");
        return ctx.decodeAudioData(buf).then(function(ab){ buffers[url] = ab; });
      }).catch(function(){}).then(audioProgress);
    });
  }

  function cancelSpeech(){
    if(!current) return;
    try{ current.onended = null; }catch(e){}
    try{ current.stop(); }catch(e){}
    try{ current.disconnect(); }catch(e){}
    current = null;
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    var buf = buffers[audioUrl(L.word)];
    if(buf && ctx){
      if(ctx.state === "suspended") ctx.resume();
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.onended = function(){ if(wordActive) finishWord(); };
      current = src;
      src.start();
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-deep", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    elArt.textContent = L.art;
    elArt.setAttribute("aria-label", "点击朗读 " + L.word);
    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) readWord();
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
