/* ── Design plan ────────────────────────────────────────────────
   Subject: 12 words from a story about a puppy — the best friend who
            played all day, came from mum and dad, was cared for,
            left, and is kept in a photo.
   Color  : evening lavender — pale lilac paper, indigo ink, and an
            accent that re-tints at every stop (cocoa, rose, sky,
            moss). The stage is a taped photo frame with a few stars
            around it, like a picture pinned above a bed.
   Type   : Baloo 2 (rounded display: word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, photo stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#F5F2FB;
  --bg-glow:#E4DDF5;
  --surface:#FEFDFF;
  --surface-2:#F0ECF8;
  --ink:#2C2A3D;
  --ink-soft:#7E7A96;
  --line:#E2DDF0;
  --accent:#8A7ABF;
  --accent-deep:#5B4E8C;
  --accent-ink:var(--accent-deep);
  --accent-soft:rgba(138,122,191,.16);
  --shadow:0 20px 44px -22px rgba(60,50,100,.35), 0 2px 6px rgba(60,50,100,.06);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131218;
    --bg-glow:#252135;
    --surface:#1D1B26;
    --surface-2:#262334;
    --ink:#F1EEFA;
    --ink-soft:#A8A3BE;
    --line:#332F44;
    --accent-ink:var(--accent);
    --accent-soft:rgba(138,122,191,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .btn.primary,
  :root:not([data-theme="light"]) .coach{color:#131218}
}
:root[data-theme="dark"]{
  --bg:#131218;
  --bg-glow:#252135;
  --surface:#1D1B26;
  --surface-2:#262334;
  --ink:#F1EEFA;
  --ink-soft:#A8A3BE;
  --line:#332F44;
  --accent-ink:var(--accent);
  --accent-soft:rgba(138,122,191,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .coach{color:#131218}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}
.audio-status{
  margin-right:auto;
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
  padding:3px 10px 3px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  opacity:0;
  transform:translateY(-2px);
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
}
.audio-status.on{opacity:1;transform:none}
.audio-status.done{opacity:0;transform:translateY(-4px)}
.audio-status i{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:audioPulse 1s ease-in-out infinite;
}
@keyframes audioPulse{
  0%,100%{opacity:.35;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* photo stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(160px,27vh,214px);
  isolation:isolate;
}
.aura{
  position:absolute;
  width:190px;height:190px;
  border-radius:50%;
  background:var(--accent);
  opacity:.16;
  filter:blur(44px);
  transition:background .3s ease;
  z-index:0;
}
.frame{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-52%) rotate(-2.5deg);
  width:min(300px,84%);
  height:clamp(136px,22vh,178px);
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
  box-shadow:0 22px 38px -24px rgba(60,50,100,.55);
  transition:background .3s ease, border-color .3s ease;
  z-index:1;
}
.frame .photo{
  position:absolute;
  inset:10px 10px 30px;
  border-radius:8px;
  background:
    radial-gradient(120% 100% at 50% 0%, var(--accent-soft), transparent 70%),
    var(--surface-2);
  transition:background .3s ease;
}
.tape{
  position:absolute;
  width:58px;height:18px;
  border-radius:2px;
  background:var(--accent-soft);
  border:1px solid var(--accent-soft);
  opacity:.95;
}
.tape.t1{top:-9px;left:20px;transform:rotate(-8deg)}
.tape.t2{top:-9px;right:20px;transform:rotate(7deg)}
.star{
  position:absolute;
  color:var(--accent);
  line-height:1;
  opacity:.4;
  pointer-events:none;
  transition:color .3s ease;
  animation:twinkle 3.6s ease-in-out infinite;
}
.star.s1{left:12%;top:22%;font-size:15px}
.star.s2{right:15%;top:16%;font-size:11px;animation-delay:-1.6s}
.star.s3{right:24%;bottom:20%;font-size:13px;animation-delay:-2.7s}
@keyframes twinkle{
  0%,100%{opacity:.18;transform:scale(.85)}
  50%{opacity:.6;transform:scale(1.1)}
}
.paw{
  position:absolute;
  left:13%;bottom:14%;
  font-size:19px;
  opacity:.2;
  transform:rotate(-16deg);
  pointer-events:none;
  z-index:2;
}

.art{
  position:relative;
  z-index:3;
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:calc(clamp(72px,18.5vw,114px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(50,40,90,.24));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(50,40,90,.32))}
.art-sm{
  position:absolute;
  right:12%;
  bottom:9%;
  z-index:4;
  font-size:38px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(50,40,90,.2));
  animation:companionFloat 3.2s ease-in-out infinite;
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}
@keyframes companionFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

/* one motion per stop: a tail wag, a lean, a nod, a spin, a float,
   a pop, a slide in, a hug, a cradle rock, a walk away, a camera
   snap, and a slow missing-him drift */
.art.anim-wag{animation:wagTail 1.1s ease-in-out 2;transform-origin:50% 80%}
@keyframes wagTail{
  0%,100%{transform:rotate(-9deg)}
  25%{transform:rotate(11deg)}
  50%{transform:rotate(-7deg)}
  75%{transform:rotate(8deg)}
}
.art.anim-friend{animation:friendLean 1.5s ease-in-out 2}
@keyframes friendLean{
  0%,100%{transform:rotate(0) translateX(0)}
  25%{transform:rotate(-6deg) translateX(-9px)}
  60%{transform:rotate(6deg) translateX(9px)}
  85%{transform:rotate(-2deg) translateX(-2px)}
}
.art.anim-tell{animation:tellNod 1.2s ease-in-out 2}
@keyframes tellNod{
  0%,100%{transform:translateY(0) rotate(0)}
  20%{transform:translateY(7px) rotate(2deg)}
  40%{transform:translateY(-4px) rotate(-1deg)}
  62%{transform:translateY(6px) rotate(2deg)}
  82%{transform:translateY(0) rotate(0)}
}
.art.anim-play{animation:playSpin 1.5s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes playSpin{
  0%,100%{transform:rotate(0) translateY(0)}
  30%{transform:rotate(160deg) translateY(-16px)}
  65%{transform:rotate(360deg) translateY(0)}
  85%{transform:rotate(360deg) translateY(-6px)}
}
.art.anim-sweet{animation:sweetFloat 2s ease-in-out 2}
@keyframes sweetFloat{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-13px) rotate(4deg)}
}
.art.anim-got{animation:gotPop 1.35s cubic-bezier(.3,1.4,.4,1) 2}
@keyframes gotPop{
  0%{transform:translateY(30px) scale(.4);opacity:0}
  45%{transform:translateY(-10px) scale(1.12);opacity:1}
  70%{transform:translateY(0) scale(.98)}
  100%{transform:none;opacity:1}
}
.art.anim-from{animation:fromSlide 1.5s cubic-bezier(.25,1.1,.4,1) 2}
@keyframes fromSlide{
  0%{transform:translateX(-48px) rotate(-10deg);opacity:.25}
  55%{transform:translateX(7px) rotate(3deg);opacity:1}
  80%{transform:translateX(-2px) rotate(0)}
  100%{transform:none;opacity:1}
}
.art.anim-parents{animation:parentsHug 1.6s ease-in-out 2}
@keyframes parentsHug{
  0%,100%{transform:scale(1,1)}
  24%{transform:scale(.84,1.1)}
  54%{transform:scale(1.1,.9)}
  78%{transform:scale(.96,1.04)}
  90%{transform:scale(1.01,.99)}
}
.art.anim-care{animation:careRock 2.2s ease-in-out 2}
@keyframes careRock{
  0%,100%{transform:rotate(-5deg) translateY(0)}
  50%{transform:rotate(5deg) translateY(-7px)}
}
.art.anim-leave{animation:leaveWalk 2.2s ease-in-out 2}
@keyframes leaveWalk{
  0%,100%{transform:translateX(0) rotate(0);opacity:1}
  28%{transform:translateX(24px) rotate(6deg);opacity:.4}
  52%{transform:translateX(34px) rotate(8deg);opacity:.15}
  78%{transform:translateX(8px) rotate(2deg);opacity:.75}
}
.art.anim-photo{animation:photoSnap 1.15s ease-in-out 2}
@keyframes photoSnap{
  0%,100%{transform:scale(1);filter:brightness(1)}
  14%{transform:scale(.94)}
  30%{transform:scale(1.13);filter:brightness(1.3)}
  46%{transform:scale(1);filter:brightness(1.05)}
  72%{transform:scale(1.03)}
}
.art.anim-miss{animation:missFloat 2.4s ease-in-out 2}
@keyframes missFloat{
  0%,100%{transform:translateY(0) rotate(0);opacity:1}
  40%{transform:translateY(-15px) rotate(-5deg);opacity:.7}
  70%{transform:translateY(-4px) rotate(3deg);opacity:.9}
}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
  max-width:100%;
  overflow-wrap:anywhere;
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:6;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:600px){
  .card{padding-bottom:52px}
  .coach{bottom:8px}
}
@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(23px,6.6vw,30px)}
  .art-sm{right:9%;font-size:32px}
  .frame{width:88%}
  .star.s3{display:none}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="audio-status" id="audioStatus" aria-hidden="true"><i></i><span id="audioCount"></span></div>
    <div class="prog" id="prog">1 / 12</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="aura"></div>
      <div class="frame" aria-hidden="true">
        <div class="photo"></div>
        <span class="tape t1"></span>
        <span class="tape t2"></span>
      </div>
      <span class="star s1" aria-hidden="true">✦</span>
      <span class="star s2" aria-hidden="true">✦</span>
      <span class="star s3" aria-hidden="true">✦</span>
      <span class="paw" aria-hidden="true">🐾</span>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">🐶</div>
      <div class="art-sm" id="artSm" data-label="bone" hidden>🦴</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta" aria-live="polite">
      <span class="w" id="mWord">puppy</span>
      <span class="ipa" id="mIpa">/ˈpʌpi/</span>
      <span class="cn" id="mCn">小狗</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"puppy",                  ipa:"/ˈpʌpi/",                        cn:"小狗",               art:"🐶",  scale:1,    color:"#B07E52", ink:"#7A4E28", anim:"wag",     fx:["🦴","✨","🐾"], small:"🦴", smallLabel:"bone" },
    { word:"my best friend",         ipa:"/maɪ best frend/",               cn:"我最好的朋友",       art:"🫂",  scale:1,    color:"#B5648C", ink:"#7E3A60", anim:"friend",  fx:["💛","✨","💫"], small:"💛", smallLabel:"heart" },
    { word:"tell me",                ipa:"/tel miː/",                      cn:"告诉我",             art:"💬",  scale:1,    color:"#5C87B8", ink:"#335C8C", anim:"tell",    fx:["💬","✨","💫"] },
    { word:"play all day together",  ipa:"/pleɪ ɔːl deɪ təˈɡeðər/",        cn:"一起玩一整天",       art:"🎾",  scale:1,    color:"#6FA85E", ink:"#436F34", anim:"play",    fx:["🎾","🐾","✨"], small:"⚽", smallLabel:"ball" },
    { word:"happy and sweet",        ipa:"/ˈhæpi ænd swiːt/",              cn:"快乐又甜蜜",         art:"🍬",  scale:1,    color:"#D9879E", ink:"#9C4460", anim:"sweet",   fx:["🍬","✨","💗"], small:"🍬", smallLabel:"candy" },
    { word:"got",                    ipa:"/ɡɑːt/",                         cn:"得到",               art:"🎁",  scale:1,    color:"#D08A3C", ink:"#8C5312", anim:"got",     fx:["🎁","✨","🌟"] },
    { word:"from",                   ipa:"/frʌm/",                         cn:"来自",               art:"🏠",  scale:1,    color:"#8A7ABF", ink:"#574A8C", anim:"from",    fx:["🏠","💗","✨"] },
    { word:"parents",                ipa:"/ˈperənts/",                     cn:"爸爸妈妈",           art:"👨‍👩‍👧", scale:.82, color:"#C06A5E", ink:"#8A3B30", anim:"parents", fx:["💗","👨‍👩‍👧","✨"] },
    { word:"take good care of",      ipa:"/teɪk ɡʊd ker əv/",              cn:"好好照顾",           art:"🧺",  scale:1,    color:"#A87E52", ink:"#6F4C24", anim:"care",    fx:["🥣","💗","✨"], small:"🥣", smallLabel:"bowl" },
    { word:"leave",                  ipa:"/liːv/",                         cn:"离开",               art:"👋",  scale:1,    color:"#8E8AA8", ink:"#58556F", anim:"leave",   fx:["👋","🍂","✨"] },
    { word:"photo",                  ipa:"/ˈfoʊtoʊ/",                      cn:"照片",               art:"📷",  scale:1,    color:"#5F8FA8", ink:"#356073", anim:"photo",   fx:["📷","✨","🌟"] },
    { word:"miss him",               ipa:"/mɪs hɪm/",                      cn:"想念他",             art:"💭",  scale:1,    color:"#8E86C4", ink:"#5B519C", anim:"miss",    fx:["💭","💛","✨"], small:"💭", smallLabel:"thought" }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  // iOS 上 HTMLAudioElement 的 play() 会同步阻塞主线程（实测约 700ms），
  // 改用 Web Audio：预先把音频解码成 AudioBuffer，点击时只启动 BufferSource。
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var ctx = AudioCtx ? new AudioCtx() : null;
  // iOS 16.4+：把 Web Audio 归到 media 通道，静音键打开时也能出声
  if(navigator.audioSession) navigator.audioSession.type = "playback";
  var buffers = {};    // url -> AudioBuffer
  var current = null;  // 当前正在播放的 BufferSource

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  // 用 fetch 预取本课全部音频并解码成 AudioBuffer，点击时直接启动播放，不再等待网络
  // （iOS Safari 会忽略 Audio 的 preload；HTMLAudioElement.play() 还会阻塞主线程约 0.7s）
  var elAudioStatus = $("audioStatus"), elAudioCount = $("audioCount");
  var audioTotal = LESSONS.length, audioLoaded = 0, audioStatusTimer = null;

  function audioDone(){
    clearTimeout(audioStatusTimer);
    if(elAudioStatus.classList.contains("on")){
      elAudioStatus.classList.add("done");
      setTimeout(function(){ elAudioStatus.classList.remove("on", "done"); }, 400);
    }
  }

  function audioProgress(){
    audioLoaded++;
    elAudioCount.textContent = audioLoaded + "/" + audioTotal;
    if(audioLoaded === audioTotal) audioDone();
  }

  elAudioCount.textContent = "0/" + audioTotal;

  if(window.fetch){
    // 预取超过 150ms 才显示进度，避免缓存命中时闪一下
    audioStatusTimer = setTimeout(function(){
      if(audioLoaded < audioTotal) elAudioStatus.classList.add("on");
    }, 150);
    LESSONS.forEach(function(L){
      var url = audioUrl(L.word);
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.arrayBuffer();
      }).then(function(buf){
        if(!ctx) throw new Error("no Web Audio");
        return ctx.decodeAudioData(buf).then(function(ab){ buffers[url] = ab; });
      }).catch(function(){}).then(audioProgress);
    });
  }

  function cancelSpeech(){
    if(!current) return;
    try{ current.onended = null; }catch(e){}
    try{ current.stop(); }catch(e){}
    try{ current.disconnect(); }catch(e){}
    current = null;
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    var buf = buffers[audioUrl(L.word)];
    if(buf && ctx){
      if(ctx.state === "suspended") ctx.resume();
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.onended = function(){ if(wordActive) finishWord(); };
      current = src;
      src.start();
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-deep", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    elArt.textContent = L.art;
    elArt.setAttribute("aria-label", "点击朗读 " + L.word);
    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) readWord();
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
<script src="sw-register.js"></script>
