/* ── Design plan ────────────────────────────────────────────────
   Subject: 22 words from "You make me smile" — praise, affection,
            and the small everyday acts of growing up: brushing teeth,
            sharing a strawberry, getting up after a fall, putting on
            shoes, flipping pages, and the shining moments in between.
   Color  : a warm morning blush — peach paper, plum ink, and an
            accent that re-tints at every stop (coral, rose, honey,
            lilac, sky). The stage is an arch of soft light with
            little hearts drifting up through it.
   Type   : Baloo 2 (rounded display: word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, heart stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#FDF5EF;
  --bg-glow:#FBE1D2;
  --surface:#FFFDF9;
  --surface-2:#F9EDE4;
  --ink:#3A2A2E;
  --ink-soft:#8E726E;
  --line:#EEDCD1;
  --accent:#D9694F;
  --accent-deep:#9B3A24;
  --accent-ink:var(--accent-deep);
  --accent-soft:rgba(217,105,79,.16);
  --shadow:0 20px 44px -22px rgba(110,60,45,.35), 0 2px 6px rgba(110,60,45,.06);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191217;
    --bg-glow:#2E1F24;
    --surface:#231A1F;
    --surface-2:#2E2228;
    --ink:#F9EBE4;
    --ink-soft:#B9A39D;
    --line:#3D2D33;
    --accent-ink:var(--accent);
    --accent-soft:rgba(217,105,79,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .btn.primary,
  :root:not([data-theme="light"]) .coach{color:#191217}
}
:root[data-theme="dark"]{
  --bg:#191217;
  --bg-glow:#2E1F24;
  --surface:#231A1F;
  --surface-2:#2E2228;
  --ink:#F9EBE4;
  --ink-soft:#B9A39D;
  --line:#3D2D33;
  --accent-ink:var(--accent);
  --accent-soft:rgba(217,105,79,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}
:root[data-theme="dark"] .btn.primary,
:root[data-theme="dark"] .coach{color:#191217}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}
.audio-status{
  margin-right:auto;
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.5px;
  font-variant-numeric:tabular-nums;
  color:var(--ink-soft);
  padding:3px 10px 3px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  opacity:0;
  transform:translateY(-2px);
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
}
.audio-status.on{opacity:1;transform:none}
.audio-status.done{opacity:0;transform:translateY(-4px)}
.audio-status i{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:audioPulse 1s ease-in-out infinite;
}
@keyframes audioPulse{
  0%,100%{opacity:.35;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.15)}
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* heart stage */
.art-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(156px,26vh,212px);
  isolation:isolate;
}
.aura{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.17;
  filter:blur(42px);
  transition:background .3s ease;
  z-index:0;
}
.arch{
  position:absolute;
  left:50%;bottom:-58px;
  transform:translateX(-50%);
  width:min(330px,90%);
  height:176px;
  border:2px solid var(--accent-soft);
  border-bottom:0;
  border-radius:50% 50% 0 0;
  background:linear-gradient(180deg, transparent 30%, var(--accent-soft));
  opacity:.8;
  transition:background .3s ease, border-color .3s ease;
  pointer-events:none;
  z-index:1;
}
.heart{
  position:absolute;
  z-index:2;
  color:var(--accent);
  line-height:1;
  opacity:.5;
  pointer-events:none;
  transition:color .3s ease;
  animation:heartFloat 5s ease-in-out infinite;
}
.heart.h1{left:11%;bottom:24%;font-size:19px;animation-delay:-1.2s}
.heart.h2{right:14%;bottom:36%;font-size:25px;animation-delay:-2.8s}
.heart.h3{left:25%;bottom:46%;font-size:13px;animation-delay:-3.9s}
@keyframes heartFloat{
  0%,100%{transform:translateY(0) rotate(-7deg);opacity:.3}
  50%{transform:translateY(-15px) rotate(7deg);opacity:.65}
}

.art{
  position:relative;
  z-index:3;
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:calc(clamp(74px,19vw,118px) * var(--art-scale,1));
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(110,60,45,.22));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.art:hover{filter:drop-shadow(0 18px 24px rgba(110,60,45,.3))}
.art-sm{
  position:absolute;
  right:12%;
  bottom:11%;
  z-index:4;
  font-size:40px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(110,60,45,.18));
  animation:companionFloat 3.2s ease-in-out infinite;
}
.art-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.art-sm[hidden]{display:none}
@keyframes companionFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

/* one motion per stop: a grin, a chest puff, a heartbeat, a star pop,
   a hug, a lucky spin, a rise, a wobble of the world, growing up,
   a roar, a gentle bob, a jump, brushing, sharing, standing back up,
   flexing, a sparkle, a swirl, a step, a page turn, a shine */
.art.anim-smile{animation:smilePop 1.2s cubic-bezier(.3,1.3,.4,1) 2}
@keyframes smilePop{
  0%,100%{transform:scale(1)}
  22%{transform:scale(1.18,.86)}
  44%{transform:scale(.93,1.1)}
  64%{transform:scale(1.07,.95)}
  82%{transform:scale(.99,1.01)}
}
.art.anim-proud{animation:proudPuff 1.4s ease-in-out 2}
@keyframes proudPuff{
  0%,100%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-11px) scale(1.09)}
  56%{transform:translateY(-4px) scale(1.03)}
  78%{transform:translateY(-7px) scale(1.05)}
}
.art.anim-always{animation:alwaysBeat 1.1s ease-in-out 2}
@keyframes alwaysBeat{
  0%,100%{transform:scale(1)}
  16%{transform:scale(1.09)}
  30%{transform:scale(1)}
  48%{transform:scale(1.13)}
  64%{transform:scale(1)}
}
.art.anim-best{animation:bestPop 1.35s cubic-bezier(.3,1.4,.4,1) 2}
@keyframes bestPop{
  0%{transform:scale(.45) rotate(-14deg);opacity:.35}
  42%{transform:scale(1.2) rotate(7deg);opacity:1}
  66%{transform:scale(.96) rotate(-2deg)}
  100%{transform:scale(1) rotate(0)}
}
.art.anim-hug{animation:hugSqueeze 1.4s ease-in-out 2}
@keyframes hugSqueeze{
  0%,100%{transform:scale(1,1)}
  24%{transform:scale(.82,1.1)}
  50%{transform:scale(1.1,.9)}
  72%{transform:scale(.95,1.05)}
  88%{transform:scale(1.02,.98)}
}
.art.anim-lucky{animation:luckySpin 1.6s cubic-bezier(.3,1.1,.4,1) 2}
@keyframes luckySpin{
  0%,100%{transform:rotate(0) translateY(0) scale(1)}
  30%{transform:rotate(170deg) translateY(-16px) scale(1.06)}
  62%{transform:rotate(360deg) translateY(0) scale(1)}
}
.art.anim-hold{animation:holdOpen 1.5s ease-in-out 2}
@keyframes holdOpen{
  0%,100%{transform:translateY(0) scale(1)}
  35%{transform:translateY(-9px) scale(1.1)}
  70%{transform:translateY(2px) scale(1.02)}
}
.art.anim-mean{animation:meanBeat 1.05s ease-in-out 2}
@keyframes meanBeat{
  0%,100%{transform:scale(1)}
  14%{transform:scale(1.1)}
  26%{transform:scale(1.02)}
  44%{transform:scale(1.12)}
  60%{transform:scale(1)}
}
.art.anim-world{animation:worldTurn 2.4s ease-in-out 2}
@keyframes worldTurn{
  0%,100%{transform:rotate(0) translateX(0)}
  25%{transform:rotate(-9deg) translateX(-6px)}
  55%{transform:rotate(9deg) translateX(6px)}
  78%{transform:rotate(-3deg) translateX(-2px)}
}
.art.anim-grow{animation:growUp 1.7s cubic-bezier(.25,1.1,.4,1) 2}
@keyframes growUp{
  0%{transform:translateY(24px) scale(.5);opacity:.3}
  50%{transform:translateY(-11px) scale(1.08);opacity:1}
  76%{transform:translateY(0) scale(.99)}
  100%{transform:none;opacity:1}
}
.art.anim-brave{animation:braveRoar 1.15s ease-in-out 2}
@keyframes braveRoar{
  0%,100%{transform:scale(1) translate(0,0)}
  18%{transform:scale(1.13,.94) translate(-4px,0)}
  38%{transform:scale(.95,1.07) translate(5px,0)}
  58%{transform:scale(1.07,.97) translate(-3px,0)}
  78%{transform:scale(1) translate(1px,0)}
}
.art.anim-kind{animation:kindBob 2s ease-in-out 2}
@keyframes kindBob{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-9px) rotate(2deg)}
}
.art.anim-joy{animation:joyJump 1.15s cubic-bezier(.3,1.2,.4,1) 2}
@keyframes joyJump{
  0%,100%{transform:translateY(0) scale(1,1)}
  16%{transform:translateY(0) scale(1.07,.9)}
  48%{transform:translateY(-27px) scale(.96,1.07)}
  72%{transform:translateY(0) scale(1.06,.94)}
  88%{transform:translateY(-6px) scale(1)}
}
.art.anim-brush{animation:brushTeeth 1.2s ease-in-out 2}
@keyframes brushTeeth{
  0%,100%{transform:translate(0,0) rotate(0)}
  14%{transform:translate(-8px,2px) rotate(-3deg)}
  28%{transform:translate(8px,-2px) rotate(3deg)}
  42%{transform:translate(-6px,1px) rotate(-2deg)}
  58%{transform:translate(6px,-1px) rotate(2deg)}
  76%{transform:translate(0,0) rotate(0)}
}
.art.anim-share{animation:shareOffer 1.5s ease-in-out 2}
@keyframes shareOffer{
  0%,100%{transform:translateX(0) rotate(0)}
  28%{transform:translateX(-13px) rotate(-5deg)}
  58%{transform:translateX(13px) rotate(5deg)}
  80%{transform:translateX(0) rotate(0) scale(1.05)}
}
.art.anim-standup{animation:standUp 1.7s cubic-bezier(.25,1.1,.4,1) 2}
@keyframes standUp{
  0%{transform:translateY(18px) rotate(-13deg) scale(.92);opacity:.45}
  42%{transform:translateY(5px) rotate(5deg) scale(.98);opacity:1}
  68%{transform:translateY(-9px) rotate(-2deg) scale(1.05)}
  100%{transform:none;opacity:1}
}
.art.anim-flex{animation:flexPump 1.15s ease-in-out 2}
@keyframes flexPump{
  0%,100%{transform:scale(1,1) translateY(0)}
  24%{transform:scale(.9,1.12) translateY(5px)}
  54%{transform:scale(1.12,.92) translateY(-11px)}
  78%{transform:scale(.98,1.02) translateY(0)}
}
.art.anim-unique{animation:uniqueSparkle 1.5s cubic-bezier(.3,1.3,.4,1) 2}
@keyframes uniqueSparkle{
  0%,100%{transform:scale(1) rotate(0);opacity:1}
  25%{transform:scale(.86) rotate(-8deg);opacity:.8}
  50%{transform:scale(1.16) rotate(6deg);opacity:1}
  75%{transform:scale(1.02) rotate(-2deg)}
}
.art.anim-creative{animation:creativeSwirl 1.8s ease-in-out 2}
@keyframes creativeSwirl{
  0%,100%{transform:rotate(0) scale(1)}
  28%{transform:rotate(-17deg) scale(1.08)}
  62%{transform:rotate(17deg) scale(1.04)}
  84%{transform:rotate(-5deg) scale(1)}
}
.art.anim-step{animation:stepOn 1.15s cubic-bezier(.3,1.2,.4,1) 2}
@keyframes stepOn{
  0%,100%{transform:translateY(0) rotate(0)}
  28%{transform:translateY(-15px) rotate(-6deg)}
  52%{transform:translateY(0) rotate(4deg)}
  74%{transform:translateY(-6px) rotate(-1deg)}
}
.art.anim-flip{animation:flipPage 1.35s ease-in-out 2}
@keyframes flipPage{
  0%,100%{transform:rotateY(0) scale(1)}
  35%{transform:rotateY(-68deg) scale(.94)}
  68%{transform:rotateY(18deg) scale(1.01)}
  85%{transform:rotateY(-4deg)}
}
.art.anim-shine{animation:shinePulse 1.6s ease-in-out 2}
@keyframes shinePulse{
  0%,100%{transform:scale(1);opacity:1}
  38%{transform:scale(1.15);opacity:.82}
  66%{transform:scale(1.03);opacity:1}
}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:baseline;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding:6px 4px 10px;
  text-align:center;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(26px,6vw,38px);
  line-height:1.2;
  color:var(--accent-ink);
  max-width:100%;
  overflow-wrap:anywhere;
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.art:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:6;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:600px){
  .card{padding-bottom:52px}
  .coach{bottom:8px}
}
@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:clamp(23px,6.6vw,30px)}
  .art-sm{right:9%;font-size:34px}
  .heart.h3{display:none}
  .arch{height:150px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="audio-status" id="audioStatus" aria-hidden="true"><i></i><span id="audioCount"></span></div>
    <div class="prog" id="prog">1 / 22</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="art-wrap">
      <div class="aura"></div>
      <div class="arch" aria-hidden="true"></div>
      <span class="heart h1" aria-hidden="true">♥</span>
      <span class="heart h2" aria-hidden="true">♥</span>
      <span class="heart h3" aria-hidden="true">♥</span>
      <div class="art" id="art" role="button" tabindex="0" aria-label="点击朗读单词">😊</div>
      <div class="art-sm" id="artSm" data-label="heart" hidden>💗</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="meta" aria-live="polite">
      <span class="w" id="mWord">smile</span>
      <span class="ipa" id="mIpa">/smaɪl/</span>
      <span class="cn" id="mCn">微笑</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点图片或 ▶ 听单词发音</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>读单词</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="slow" aria-pressed="false">🐢 慢速</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"smile",                            ipa:"/smaɪl/",                       cn:"微笑",                   art:"😊",   scale:1,   color:"#D9694F", ink:"#9B3A24", anim:"smile",    fx:["💗","✨","😊"], small:"💗", smallLabel:"heart" },
    { word:"proud",                            ipa:"/praʊd/",                       cn:"自豪",                   art:"🏅",   scale:1,   color:"#D9A227", ink:"#8C6400", anim:"proud",    fx:["🏅","✨","🌟"], small:"🎖️", smallLabel:"medal" },
    { word:"always",                           ipa:"/ˈɔːlweɪz/",                    cn:"总是",                   art:"♾️",   scale:1,   color:"#C6567A", ink:"#8C2F4F", anim:"always",   fx:["💗","♾️","✨"] },
    { word:"best",                             ipa:"/best/",                        cn:"最好的",                 art:"🏆",   scale:1,   color:"#D9922B", ink:"#94600D", anim:"best",     fx:["🏆","🌟","✨"] },
    { word:"so much",                          ipa:"/soʊ mʌtʃ/",                    cn:"很多很多",               art:"💞",   scale:1,   color:"#C75B84", ink:"#8F3054", anim:"hug",      fx:["💞","💕","✨"], small:"💕", smallLabel:"hugs" },
    { word:"so lucky",                         ipa:"/soʊ ˈlʌki/",                   cn:"真幸运",                 art:"🍀",   scale:1,   color:"#56A06A", ink:"#2F6C42", anim:"lucky",    fx:["🍀","✨","🌟"] },
    { word:"have",                             ipa:"/hæv/",                         cn:"拥有",                   art:"🫶",   scale:1,   color:"#D9747F", ink:"#9C3E4A", anim:"hold",     fx:["🫶","💗","✨"], small:"🎁", smallLabel:"gift" },
    { word:"mean",                             ipa:"/miːn/",                        cn:"意味着",                 art:"💬",   scale:1,   color:"#5F8FC4", ink:"#37639C", anim:"mean",     fx:["💬","💗","✨"] },
    { word:"world",                            ipa:"/wɜːrld/",                      cn:"世界",                   art:"🌍",   scale:1,   color:"#4E9BC4", ink:"#26678C", anim:"world",    fx:["🌍","✨","🌟"] },
    { word:"grow",                             ipa:"/ɡroʊ/",                        cn:"长大",                   art:"🌱",   scale:1,   color:"#6DA85E", ink:"#416F33", anim:"grow",     fx:["🌱","🌿","✨"] },
    { word:"bravery",                          ipa:"/ˈbreɪvəri/",                   cn:"勇敢",                   art:"🦁",   scale:1,   color:"#D98A2E", ink:"#96590E", anim:"brave",    fx:["🦁","✨","🔥"], small:"🛡️", smallLabel:"shield" },
    { word:"kindness",                         ipa:"/ˈkaɪndnəs/",                   cn:"善良",                   art:"💗",   scale:1,   color:"#D96E9A", ink:"#9C385F", anim:"kind",     fx:["💗","🌸","✨"] },
    { word:"joy",                              ipa:"/dʒɔɪ/",                        cn:"快乐",                   art:"🎉",   scale:1,   color:"#E0803C", ink:"#A5520F", anim:"joy",      fx:["🎉","✨","🌟"], small:"🎈", smallLabel:"balloon" },
    { word:"brush your teeth all by yourself", ipa:"/brʌʃ jɔːr tiːθ ɔːl baɪ jɔːrˈself/", cn:"自己刷牙",           art:"🪥",   scale:1,   color:"#4FA3A8", ink:"#276B70", anim:"brush",    fx:["🪥","✨","💧"] },
    { word:"share your strawberry",            ipa:"/ʃer jɔːr ˈstrɔːberi/",        cn:"分享你的草莓",           art:"🍓",   scale:1,   color:"#D64F63", ink:"#942A3A", anim:"share",    fx:["🍓","💗","✨"] },
    { word:"get up by yourself after falling", ipa:"/ɡet ʌp baɪ jɔːrˈself ˈæftər ˈfɔːlɪŋ/", cn:"跌倒后自己站起来", art:"🩹",   scale:1,   color:"#C77B4E", ink:"#8A4A24", anim:"standup",  fx:["🩹","✨","💪"] },
    { word:"strong and brave",                 ipa:"/strɔːŋ ænd breɪv/",            cn:"坚强又勇敢",             art:"💪",   scale:1,   color:"#C1683D", ink:"#8A3F1D", anim:"flex",     fx:["💪","✨","🔥"], small:"🦁", smallLabel:"lion" },
    { word:"unique",                           ipa:"/juˈniːk/",                     cn:"独一无二的",             art:"🌟",   scale:1,   color:"#B986C9", ink:"#7E4E92", anim:"unique",   fx:["🌟","✨","💫"] },
    { word:"how creative",                     ipa:"/haʊ kriˈeɪtɪv/",               cn:"多么有创意",             art:"🎨",   scale:1,   color:"#8E73C4", ink:"#5C4389", anim:"creative", fx:["🎨","✨","🌟"] },
    { word:"put on your shoes",                ipa:"/pʊt ɑːn jɔːr ʃuːz/",           cn:"穿上鞋子",               art:"👟",   scale:1,   color:"#4E8FC4", ink:"#2A5E8E", anim:"step",     fx:["👟","✨","💫"] },
    { word:"flip the leaves",                  ipa:"/flɪp ðə liːvz/",               cn:"翻书页",                 art:"📖",   scale:1,   color:"#C98B3C", ink:"#8B5612", anim:"flip",     fx:["📖","🍃","✨"] },
    { word:"shining moments",                  ipa:"/ˈʃaɪnɪŋ ˈmoʊmənts/",           cn:"闪光的时刻",             art:"✨",   scale:1,   color:"#D9B52B", ink:"#8A6E00", anim:"shine",    fx:["✨","🌟","💫"], small:"⭐", smallLabel:"star" }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elArt = $("art"), elArtSm = $("artSm"),
      elFx = $("fx"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, slow = false, autoAll = false;
  var coached = false, started = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  var audio = new Audio();
  audio.preload = "auto";

  function audioUrl(word){
    var slug = word.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "audio/" + slug + ".mp3";
  }

  // 用 fetch 预取本课全部音频并存成 Blob，点击时直接播放本地数据，不再等待网络
  // （iOS Safari 会忽略 Audio 的 preload，fetch 不受自动播放策略限制）
  var blobUrls = {};
  var elAudioStatus = $("audioStatus"), elAudioCount = $("audioCount");
  var audioTotal = LESSONS.length, audioLoaded = 0, audioStatusTimer = null;

  function audioDone(){
    clearTimeout(audioStatusTimer);
    if(elAudioStatus.classList.contains("on")){
      elAudioStatus.classList.add("done");
      setTimeout(function(){ elAudioStatus.classList.remove("on", "done"); }, 400);
    }
  }

  function audioProgress(){
    audioLoaded++;
    elAudioCount.textContent = audioLoaded + "/" + audioTotal;
    if(audioLoaded === audioTotal) audioDone();
  }

  elAudioCount.textContent = "0/" + audioTotal;

  if(window.fetch){
    // 预取超过 150ms 才显示进度，避免缓存命中时闪一下
    audioStatusTimer = setTimeout(function(){
      if(audioLoaded < audioTotal) elAudioStatus.classList.add("on");
    }, 150);
    LESSONS.forEach(function(L){
      var url = audioUrl(L.word);
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.blob();
      }).then(function(b){
        blobUrls[url] = URL.createObjectURL(new Blob([b], { type: "audio/mpeg" }));
      }).catch(function(){}).then(audioProgress);
    });
  }

  function cancelSpeech(){
    try{ audio.pause(); }catch(e){}
    audio.onended = null;
    audio.onerror = null;
    try{ audio.currentTime = 0; }catch(e){}
  }

  /* ── reading ────────────────────────────────────── */
  var wordActive = false;

  function stopAll(){
    wordActive = false;
    cancelSpeech();
  }

  function finishWord(){
    wordActive = false;
    cancelSpeech();
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || wordActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readWord(){
    stopAll();
    var L = LESSONS[idx];
    wordActive = true;

    playAnim(L);

    var url = audioUrl(L.word);
    audio.src = blobUrls[url] || url;
    audio.playbackRate = slow ? 0.72 : 1;
    audio.onended = function(){ if(wordActive) finishWord(); };
    audio.onerror = function(){ if(wordActive) finishWord(); };
    var p = audio.play();
    if(p && p.catch){
      p.catch(function(err){
        if(err && err.name === "AbortError") return;
        if(wordActive) finishWord();
      });
    }
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elArt.className = "art";
    void elArt.offsetWidth;
    elArt.classList.add("anim-" + L.anim);
    spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function show(i, autoplay){
    stopAll();
    if(started) dismissCoach();   /* 一换词就收起提示，长短语才不会压住中文 */
    started = true;
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-deep", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));
    root.style.setProperty("--art-scale", L.scale || 1);

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elArt.className = "art";
    elArt.textContent = L.art;
    elArt.setAttribute("aria-label", "点击朗读 " + L.word);
    if(L.small){
      elArtSm.textContent = L.small;
      elArtSm.setAttribute("data-label", L.smallLabel || "");
      elArtSm.hidden = false;
    }
    else { elArtSm.hidden = true; }

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) readWord();
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + (L.chip || L.art) + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setSlow(v){
    slow = v;
    $("slow").setAttribute("aria-pressed", v ? "true" : "false");
  }
  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("click", function(){ dismissCoach(); readWord(); });
  elArt.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readWord(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("slow").addEventListener("click", function(){ dismissCoach(); setSlow(!slow); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readWord(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readWord(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
})();
</script>
