<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语音朗读诊断 · audio-test</title>
<meta name="robots" content="noindex">
<style>
:root{
  --paper:#F4F6EC; --card:#FFFEF8; --ink:#1F3027; --muted:#6D7D70;
  --line:#D8E0CE; --ok:#2F7D4F; --bad:#C0472C; --warn:#A8791A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101713; --card:#18241D; --ink:#EFF5E9; --muted:#A2B3A5;
    --line:#2B3A30; --ok:#7DD09B; --bad:#F08872; --warn:#E0BC66;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0; padding:20px 16px 48px; background:var(--paper); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
h1{font-size:20px; margin:0 0 4px}
h2{font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:600}
.lead{margin:0 0 20px; color:var(--muted); font-size:14px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px; margin:0 0 14px;
}
ul{list-style:none; margin:0; padding:0}
li{padding:5px 0; border-bottom:1px dashed var(--line); font-size:14px; word-break:break-all}
li:last-child{border-bottom:0}
li b{font-weight:600}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.warn{color:var(--warn)}
.verdict{font-size:15px; font-weight:600; margin:0}
label{display:block; font-size:14px; color:var(--muted); margin:0 0 10px}
input[type=text],select,input[type=range]{
  width:100%; margin-top:4px; padding:9px 10px; font:inherit; color:var(--ink);
  background:var(--paper); border:1px solid var(--line); border-radius:9px;
}
input[type=range]{padding:0}
.row{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 10px}
button{
  flex:1 1 auto; min-width:130px; font:inherit; font-size:14px; cursor:pointer;
  padding:11px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--ink);
}
button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
button:active{opacity:.75}
pre{
  margin:10px 0 0; padding:12px; min-height:96px; max-height:260px; overflow:auto;
  background:var(--paper); border:1px solid var(--line); border-radius:10px;
  font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; word-break:break-all;
}
.note{font-size:13px; color:var(--muted); margin:10px 0 0}
</style>
</head>
<body>

<h1>语音朗读诊断</h1>
<p class="lead">课程页面用浏览器的 Web Speech API 朗读单词。本页逐步检查：浏览器有没有这个接口、有没有可用语音、点了之后发不发声。页面不联网、不收集任何信息。</p>

<section class="card">
  <h2>结论</h2>
  <p id="verdict" class="verdict">检查中…</p>
</section>

<section class="card">
  <h2>1 · 浏览器环境</h2>
  <ul id="env"></ul>
</section>

<section class="card">
  <h2>2 · 可用语音 <span id="voiceCount"></span></h2>
  <ul id="voiceList"></ul>
  <div class="row"><button id="refresh">重新读取语音列表</button></div>
  <p class="note">如果这里是 0 条，说明系统没有装英文语音包，或者浏览器拿不到系统 TTS——这就会“点了没反应”。</p>
</section>

<section class="card">
  <h2>3 · 发声测试</h2>
  <label>要读的文字
    <input id="text" type="text" value="cat" autocomplete="off">
  </label>
  <label>语言
    <select id="lang">
      <option value="en-US">en-US（美式英语）</option>
      <option value="en-GB">en-GB（英式英语）</option>
      <option value="">不设置 lang</option>
    </select>
  </label>
  <label>语速 <span id="rateVal">0.86</span>
    <input id="rate" type="range" min="0.5" max="1.2" step="0.02" value="0.86">
  </label>
  <div class="row">
    <button id="speakVoice" class="primary">🔊 朗读（指定英文语音）</button>
    <button id="speakPlain">🔊 朗读（不指定语音）</button>
  </div>
  <div class="row">
    <button id="beep">🔔 播放提示音</button>
    <button id="stop">⏹ 停止</button>
  </div>
  <pre id="log"></pre>
  <p class="note">先点“播放提示音”：听到“叮”说明浏览器音频通路正常，问题只在语音合成。听不到就是浏览器/系统被静音了。</p>
</section>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var logEl = $("log");

  function log(msg){
    var t = new Date().toLocaleTimeString("zh-CN", {hour12:false});
    logEl.textContent += "[" + t + "] " + msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addRow(list, label, value, cls){
    var li = document.createElement("li");
    var b = document.createElement("b");
    b.textContent = label;
    li.appendChild(b);
    li.appendChild(document.createTextNode("：" + value));
    if(cls) li.className = cls;
    list.appendChild(li);
    return li;
  }

  /* ── 环境 ─────────────────────────────────────── */
  var synth = window.speechSynthesis;
  var hasSynth = !!synth;
  var hasUtt = typeof window.SpeechSynthesisUtterance === "function";
  var AC = window.AudioContext || window.webkitAudioContext;

  var env = $("env");
  addRow(env, "浏览器标识", navigator.userAgent);
  addRow(env, "speechSynthesis", hasSynth ? "存在 ✅" : "不存在 ❌", hasSynth ? "ok" : "bad");
  addRow(env, "SpeechSynthesisUtterance", hasUtt ? "存在 ✅" : "不存在 ❌", hasUtt ? "ok" : "bad");
  addRow(env, "audio 标签", typeof window.Audio === "function" ? "支持 ✅" : "不支持 ❌");
  addRow(env, "AudioContext", AC ? "支持 ✅" : "不支持 ❌");

  /* ── 语音 ─────────────────────────────────────── */
  var voices = [];
  var voicesChangedFired = false;

  function voiceList(){
    if(!hasSynth) return [];
    var list = synth.getVoices();
    return list ? Array.prototype.slice.call(list) : [];
  }

  function renderVoices(){
    voices = voiceList();
    var ul = $("voiceList");
    ul.textContent = "";
    $("voiceCount").textContent = "（" + voices.length + " 条）";

    if(!voices.length){
      var li = document.createElement("li");
      li.className = "bad";
      li.textContent = "没有拿到任何语音";
      ul.appendChild(li);
      return;
    }
    voices.forEach(function(v, i){
      var extras = [];
      if(v.lang) extras.push(v.lang);
      if(v.localService === false) extras.push("在线语音");
      if(v.default) extras.push("默认");
      var li = document.createElement("li");
      li.textContent = (i + 1) + ". " + (v.name || "(无名)") + (extras.length ? " — " + extras.join(" · ") : "");
      if(/^en[-_]/i.test(v.lang || "")) li.className = "ok";
      ul.appendChild(li);
    });
  }

  function pickEnVoice(){
    var en = voices.filter(function(v){ return /^en[-_]/i.test(v.lang || ""); });
    if(!en.length) return null;
    for(var i=0;i<en.length;i++){ if(/^en[-_]US/i.test(en[i].lang || "")) return en[i]; }
    return en[0];
  }

  renderVoices();
  if(hasSynth){
    if(typeof synth.onvoiceschanged !== "undefined"){
      synth.addEventListener("voiceschanged", function(){
        voicesChangedFired = true;
        log("事件 voiceschanged 触发，语音列表可能刚就绪");
        renderVoices();
        updateVerdict();
      });
    }
    // 部分浏览器不触发事件，只会在首次 speak 后填充，这里补读一次
    setTimeout(function(){ renderVoices(); updateVerdict(); }, 1200);
  }

  /* ── 结论 ─────────────────────────────────────── */
  function updateVerdict(){
    var v = $("verdict");
    if(!hasSynth || !hasUtt){
      v.className = "verdict bad";
      v.textContent = "❌ 这个浏览器没有 Web Speech API，课程页面在这里一定没有朗读声音，只能看动画。";
    } else if(!voices.length){
      v.className = "verdict warn";
      v.textContent = "⚠️ 接口存在，但一条语音都没有。朗读很可能静默失败。请检查系统“文字转语音”是否安装了英文语音。";
    } else {
      var en = voices.filter(function(x){ return /^en[-_]/i.test(x.lang || ""); }).length;
      if(!en){
        v.className = "verdict warn";
        v.textContent = "⚠️ 有 " + voices.length + " 条语音，但没有英文语音。读英文单词可能没声音或读不出来。";
      } else {
        v.className = "verdict ok";
        v.textContent = "✅ 接口和英文语音都在（" + en + " 条英文语音）。再点下面的“朗读”确认实际有没有声音。";
      }
    }
    var vr = $("rateVal");
    if(vr) vr.textContent = parseFloat($("rate").value).toFixed(2);
  }
  updateVerdict();

  /* ── 朗读 ─────────────────────────────────────── */
  var pendingTimer = null;

  function speak(useVoice){
    logEl.textContent = "";
    if(!hasSynth || !hasUtt){
      log("❌ 没有 Web Speech API，无法朗读");
      return;
    }
    var text = ($("text").value || "").trim() || "cat";
    var lang = $("lang").value;
    var rate = parseFloat($("rate").value);

    var u = new SpeechSynthesisUtterance(text);
    if(lang) u.lang = lang;
    u.rate = rate;
    u.pitch = 1.05;
    u.volume = 1;

    var chosen = useVoice ? pickEnVoice() : null;
    if(chosen) u.voice = chosen;

    var started = false;
    u.onstart = function(){ started = true; log("✅ onstart —— 合成器开始输出"); };
    u.onend = function(){ log("✅ onend —— 朗读结束"); };
    u.onerror = function(e){
      var why = (e && (e.error || e.name)) || "unknown";
      log("❌ onerror —— " + why + "（" + (e && e.message ? e.message : "无详情") + "）");
    };

    log("开始朗读：「" + text + "」 lang=" + (lang || "(不设置)") + " rate=" + rate +
        " voice=" + (chosen ? chosen.name + " / " + chosen.lang : (useVoice ? "(没有英文语音，未指定)" : "(不指定)")));

    try{ synth.cancel(); }catch(e){}
    try{ synth.speak(u); }
    catch(err){ log("❌ speak() 抛出异常：" + err.message); return; }

    var asked = Date.now();
    if(pendingTimer) clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function(){
      if(!started){
        log("⚠️ 1.5 秒内没有 onstart：基本可以判定没有声音。");
        log("   当前状态 speaking=" + synth.speaking + " pending=" + synth.pending + " paused=" + synth.paused);
        log("   若 speaking=true 却没有声音，多为系统语音被禁用、音量/静音，或浏览器不支持真正输出。");
      }
    }, 1500);

    // 额外观察：3 秒后仍 speaking 且没有 onstart，说明合成器卡住
    setTimeout(function(){
      if(!started && Date.now() - asked > 2500){
        log("   3 秒观察：speaking=" + synth.speaking + " pending=" + synth.pending);
      }
    }, 3000);
  }

  /* ── 提示音 ───────────────────────────────────── */
  function beep(){
    if(!AC){ log("❌ 没有 AudioContext，无法播放提示音"); return; }
    try{
      var ctx = new AC();
      if(ctx.state === "suspended" && ctx.resume) ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
      osc.start();
      osc.stop(ctx.currentTime + 0.32);
      log("🔔 已请求播放 880Hz 提示音——听到说明音频通路正常");
      osc.onended = function(){
        log("   提示音播放结束（浏览器认为已经播完）");
        try{ ctx.close(); }catch(e){}
      };
    }catch(err){
      log("❌ 提示音失败：" + err.message);
    }
  }

  /* ── 事件 ─────────────────────────────────────── */
  $("speakVoice").addEventListener("click", function(){ speak(true); });
  $("speakPlain").addEventListener("click", function(){ speak(false); });
  $("beep").addEventListener("click", beep);
  $("stop").addEventListener("click", function(){
    if(!hasSynth) return;
    try{ synth.cancel(); }catch(e){}
    log("⏹ 已调用 cancel()");
  });
  $("refresh").addEventListener("click", function(){
    renderVoices();
    updateVerdict();
    log("重新读取语音列表：" + voices.length + " 条");
  });
  $("rate").addEventListener("input", function(){
    $("rateVal").textContent = parseFloat(this.value).toFixed(2);
  });
})();
</script>
</body>
</html>
