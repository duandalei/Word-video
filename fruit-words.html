<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fruit Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;900&display=swap">
<style>
/* ── Design plan ────────────────────────────────────────────────
   Color  : warm paper ground + ink that stays brown-biased;
            the accent is re-tinted per lesson from the fruit itself
   Type   : Baloo 2 (rounded display: sentence, target word, title)
            Nunito (UI, labels, Chinese gloss)
   Layout : one centered column — word rail, reading stage, controls
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#FFF6EA;
  --bg-glow:#FFE7CC;
  --surface:#FFFDFA;
  --surface-2:#FFF4E6;
  --ink:#2C2119;
  --ink-soft:#8A7563;
  --line:#EEDCC6;
  --accent:#E5484D;
  --accent-ink:#C42A30;
  --accent-soft:rgba(229,72,77,.16);
  --shadow:0 20px 44px -22px rgba(122,80,40,.5), 0 2px 6px rgba(122,80,40,.07);
  --r-card:26px;
  --r-ctl:16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16120F;
    --bg-glow:#241A12;
    --surface:#221B15;
    --surface-2:#2A211A;
    --ink:#F8EFE5;
    --ink-soft:#B09C89;
    --line:#3B2F25;
    --accent-ink:var(--accent);
    --accent-soft:rgba(229,72,77,.22);
    --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16120F;
  --bg-glow:#241A12;
  --surface:#221B15;
  --surface-2:#2A211A;
  --ink:#F8EFE5;
  --ink-soft:#B09C89;
  --line:#3B2F25;
  --accent-ink:var(--accent);
  --accent-soft:rgba(229,72,77,.22);
  --shadow:0 20px 44px -22px rgba(0,0,0,.8), 0 2px 6px rgba(0,0,0,.45);
  color-scheme: dark;
}

html{height:100%}
*{box-sizing:border-box}
body{
  margin:0;
  padding-block:18px;
  padding-inline:16px;
  font-family:'Nunito',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  font-size:15px;
  color:var(--ink);
  background:
    radial-gradient(900px 420px at 50% -8%, var(--bg-glow), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  justify-content:center;
  -webkit-tap-highlight-color:transparent;
}

.app{width:100%;max-width:720px;margin-block:auto;display:flex;flex-direction:column;gap:14px}

/* ── Header ─────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:flex-end;gap:12px;padding-inline:4px}
.prog{
  font-weight:900;
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink-soft);
  font-variant-numeric:tabular-nums;
  padding-bottom:4px;
  white-space:nowrap;
}

/* ── Word rail ──────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font:inherit;
  font-weight:900;
  font-size:14px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 13px;
  min-height:40px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .16s ease, color .16s ease, background .16s ease, border-color .16s ease;
}
.chip:hover{border-color:var(--chip-c,var(--accent));color:var(--ink);transform:translateY(-2px)}
.chip.on{
  background:var(--chip-c,var(--accent));
  border-color:var(--chip-c,var(--accent));
  color:#fff;
  box-shadow:0 10px 20px -12px var(--chip-c,var(--accent));
}
.chip .em{font-size:15px;line-height:1}

/* ── Stage card ─────────────────────────────────────── */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:16px 16px 22px;
  border:1.5px solid var(--line);
  border-radius:var(--r-card);
  background:
    radial-gradient(460px 190px at 50% -40px, var(--accent-soft), transparent 72%),
    var(--surface);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,1.2,.42,1) both}
@keyframes cardIn{from{opacity:.35;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

/* fruit */
.fruit-wrap{
  position:relative;
  display:grid;
  place-items:center;
  height:clamp(132px,24vh,190px);
}
.glow{
  position:absolute;
  width:180px;height:180px;
  border-radius:50%;
  background:var(--accent);
  opacity:.18;
  filter:blur(40px);
  transition:background .3s ease;
}
.fruit{
  position:relative;
  font-size:clamp(74px,19vw,118px);
  line-height:1;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  filter:drop-shadow(0 16px 20px rgba(60,30,10,.22));
  transform-origin:50% 62%;
  transition:filter .2s ease;
}
.fruit:hover{filter:drop-shadow(0 18px 24px rgba(60,30,10,.3))}
.fruit-sm{
  position:absolute;
  right:12%;
  bottom:10%;
  font-size:40px;
  line-height:1;
  transform-origin:50% 60%;
  filter:drop-shadow(0 8px 10px rgba(60,30,10,.2));
}
.fruit-sm::after{
  content:attr(data-label);
  position:absolute;
  left:50%;top:100%;
  transform:translateX(-50%);
  font-family:'Nunito',sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.fruit-sm[hidden]{display:none}

/* one motion per adjective, applied to .fruit and .fruit-sm */
.fruit.anim-roll{animation:roll 1.5s cubic-bezier(.42,0,.58,1)}
@keyframes roll{0%{transform:rotate(0)}55%{transform:rotate(200deg) translateY(-12px)}100%{transform:rotate(360deg)}}
.fruit.anim-glide{animation:glide 1.8s ease-in-out}
@keyframes glide{0%,100%{transform:translateX(-16px)}50%{transform:translateX(16px)}}
.fruit.anim-yum{animation:yum 1.1s ease-in-out 2}
@keyframes yum{0%,100%{transform:translateY(0) scale(1)}28%{transform:translateY(-20px) scale(1.06)}52%{transform:translateY(1px) scale(.95)}76%{transform:translateY(-11px) scale(1.03)}}
.fruit.anim-crunch{animation:crunch .95s ease-in-out 2}
@keyframes crunch{0%,100%{transform:rotate(0) scale(1)}18%{transform:rotate(-9deg) scale(1.06)}38%{transform:rotate(9deg) scale(.96)}58%{transform:rotate(-7deg) scale(1.05)}78%{transform:rotate(7deg) scale(.98)}}
.fruit.anim-sour{animation:sour 1s ease-in-out 2}
@keyframes sour{0%,100%{transform:translateX(0) rotate(0)}14%{transform:translateX(-11px) rotate(-11deg)}30%{transform:translateX(11px) rotate(11deg)}46%{transform:translateX(-9px) rotate(-9deg)}62%{transform:translateX(9px) rotate(9deg)}80%{transform:translateX(-4px) rotate(-4deg)}}
.fruit.anim-grow{animation:grow 1.5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes grow{0%{transform:scale(.62)}50%{transform:scale(1.28)}68%{transform:scale(1.12)}100%{transform:scale(1.2)}}
.fruit-sm.anim-shrink{animation:shrink 1.2s cubic-bezier(.2,1,.4,1) both}
@keyframes shrink{from{transform:scale(1)}to{transform:scale(.62)}}
.fruit.anim-float{animation:floaty 1.6s ease-in-out 2}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-15px) rotate(2.5deg)}}
.fruit.anim-juicy{animation:juicy 1.2s ease-in-out 2}
@keyframes juicy{0%,100%{transform:scale(1) rotate(0)}22%{transform:scale(1.09) rotate(-3deg)}44%{transform:scale(.95) rotate(3deg)}66%{transform:scale(1.1) rotate(-2deg)}}

/* particles */
.fx{position:absolute;inset:0;pointer-events:none}
.fx i{
  position:absolute;
  left:50%;top:52%;
  font-style:normal;
  font-size:24px;
  opacity:0;
  animation:fxUp .95s cubic-bezier(.2,.8,.3,1) forwards;
}
@keyframes fxUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  22%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot))}
}

/* ── Sentence ───────────────────────────────────────── */
.sent-wrap{position:relative;padding:10px 4px 14px;text-align:center}
.sent{
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  font-weight:700;
  font-size:clamp(23px,6vw,38px);
  line-height:1.52;
  letter-spacing:.2px;
  text-wrap:balance;
}
.tok{
  display:inline-block;
  position:relative;
  padding:.02em .16em;
  border-radius:.3em;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  transition:transform .18s cubic-bezier(.3,1.4,.5,1), color .18s ease, background .18s ease;
}
.tok:hover{background:var(--accent-soft)}
.tok.extra{border-bottom:.09em dotted var(--accent);padding-bottom:0}
.tok.active{
  color:var(--accent-ink);
  transform:translateY(-.05em) scale(1.1);
  background:var(--accent-soft);
}
.guide{
  position:absolute;
  left:0;bottom:4px;
  height:7px;width:0;
  border-radius:99px;
  background:var(--accent);
  opacity:0;
  transition:left .2s cubic-bezier(.3,1.3,.5,1), width .2s cubic-bezier(.3,1.3,.5,1), opacity .2s ease;
}
.guide.on{opacity:1}
.guide::after{
  content:'';
  position:absolute;
  left:50%;top:-5px;
  width:9px;height:9px;
  margin-left:-4.5px;
  border-radius:50%;
  background:var(--accent);
}

/* ── Word meta ──────────────────────────────────────── */
.meta{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  padding-top:2px;
  font-weight:700;
  color:var(--ink-soft);
}
.meta .w{
  font-family:'Baloo 2',sans-serif;
  font-weight:800;
  font-size:22px;
  line-height:1;
  color:var(--accent-ink);
}
.meta .ipa{font-size:14px;letter-spacing:.4px}
.meta .cn{
  font-size:14px;
  font-weight:900;
  padding:4px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent-ink);
}

/* ── Controls ───────────────────────────────────────── */
.ctrls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font:inherit;
  font-weight:900;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:48px;
  padding:0 18px;
  border:1.5px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.975)}
.btn.primary{
  background:var(--accent-ink);
  border-color:var(--accent-ink);
  color:#fff;
  box-shadow:0 12px 24px -14px var(--accent-ink);
}
.btn.primary:hover{border-color:var(--accent-ink)}
.btn.icon{padding:0 15px;font-size:19px}
.btn[aria-pressed="true"]{
  background:var(--accent-soft);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn:focus-visible,.chip:focus-visible,.tok:focus-visible,.fruit:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
}

/* ── Coach mark ─────────────────────────────────────── */
.coach{
  position:absolute;
  left:50%;bottom:-4px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:var(--accent-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:900;
  white-space:nowrap;
  box-shadow:0 14px 26px -14px rgba(0,0,0,.6);
  animation:coachIn .5s .35s both;
  z-index:5;
}
.coach .hand{display:inline-block;font-size:17px;animation:tap 1.1s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes coachIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.coach.gone{display:none}

@media (max-width:420px){
  :root{--r-card:22px}
  .chip{font-size:13px;padding:8px 11px}
  .meta .w{font-size:20px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
  .fx{display:none}
}
</style>

<div class="app">
  <div class="head">
    <div class="prog" id="prog">1 / 8</div>
  </div>

  <nav class="chips" id="chips" aria-label="选择单词"></nav>

  <main class="card" id="card">
    <div class="fruit-wrap">
      <div class="glow"></div>
      <div class="fruit" id="fruit" role="button" tabindex="0" aria-label="点击朗读整句">🍎</div>
      <div class="fruit-sm" id="fruitSm" data-label="small" hidden>🍋</div>
      <div class="fx" id="fx"></div>
    </div>

    <div class="sent-wrap" id="sentWrap">
      <div class="sent" id="sent"></div>
      <div class="guide" id="guide"></div>
    </div>

    <div class="meta">
      <span class="w" id="mWord">round</span>
      <span class="ipa" id="mIpa">/raʊnd/</span>
      <span class="cn" id="mCn">圆的</span>
    </div>

    <div class="coach" id="coach"><span class="hand">👆</span>点单词听发音 · 点句子听带读</div>
  </main>

  <div class="ctrls">
    <button class="btn primary" id="play"><span>▶</span>整句带读</button>
    <button class="btn icon" id="prev" aria-label="上一个">←</button>
    <button class="btn icon" id="next" aria-label="下一个">→</button>
    <button class="btn" id="slow" aria-pressed="false">🐢 慢速</button>
    <button class="btn" id="all" aria-pressed="false">🔁 全部连读</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var LESSONS = [
    { word:"round",  ipa:"/raʊnd/",     cn:"圆的",   fruit:"🍎", color:"#E5484D", ink:"#C0272D", anim:"roll",   fx:["💫","✨"],
      sentence:"Here's an apple. It's so round!" },
    { word:"smooth", ipa:"/smuːð/",     cn:"光滑的", fruit:"🍌", color:"#D9A227", ink:"#8F6600", anim:"glide",  fx:["✨","🌟"],
      sentence:"Here's a banana. It's so smooth!" },
    { word:"tasty",  ipa:"/ˈteɪsti/",   cn:"美味的", fruit:"🥭", color:"#F0862B", ink:"#B85408", anim:"yum",    fx:["😋","✨","💛"],
      sentence:"Emily is eating a mango. It's so tasty!" },
    { word:"crispy", ipa:"/ˈkrɪspi/",   cn:"脆的",   fruit:"🍏", color:"#79A83A", ink:"#4B7420", anim:"crunch", fx:["💥","✨"],
      sentence:"Here's another apple. It's so crispy!" },
    { word:"sour",   ipa:"/ˈsaʊə(r)/",  cn:"酸的",   fruit:"🍋", color:"#CFA900", ink:"#7E6500", anim:"sour",   fx:["😖","💦","😝"],
      sentence:"Ashley is licking a lemon. It's so sour!" },
    { word:"big",    ipa:"/bɪɡ/",       cn:"大的",   fruit:"🍉", color:"#3E9B4F", ink:"#2C6E39", anim:"grow",   fx:["✨","😲","🎉"],
      sentence:"Here's a watermelon. It's so big! While the lemon is small.", small:"🍋", extra:["small"] },
    { word:"sweet",  ipa:"/swiːt/",     cn:"甜的",   fruit:"🍎", color:"#E2568C", ink:"#B32862", anim:"float",  fx:["💕","💗","💖"],
      sentence:"Ashley is eating an apple. It's as sweet as candy." },
    { word:"juicy",  ipa:"/ˈdʒuːsi/",   cn:"多汁的", fruit:"🍎", color:"#F2603C", ink:"#C13A1B", anim:"juicy",  fx:["💧","💦","🍹"],
      sentence:"Here's another apple. It's so juicy!" }
  ];

  var root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var elChips = $("chips"), elCard = $("card"), elFruit = $("fruit"), elFruitSm = $("fruitSm"),
      elFx = $("fx"), elSent = $("sent"), elWrap = $("sentWrap"), elGuide = $("guide"),
      elWord = $("mWord"), elIpa = $("mIpa"), elCn = $("mCn"), elProg = $("prog"),
      elPlay = $("play"), elCoach = $("coach");

  var idx = 0, slow = false, autoAll = false;
  var tokens = [], tokenEls = [], activeIdx = -1;
  var timers = [], endTimer = null, curUtt = null, speechStarted = false, coached = false;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── speech ─────────────────────────────────────── */
  var hasSpeech = ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window);
  var voices = [];

  function loadVoices(){
    if(!hasSpeech) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if(hasSpeech && window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  var PREFERRED = ["Google US English","Samantha","Karen","Microsoft Aria Online (Natural) - English (United States)",
                   "Microsoft Aria","Microsoft Jenny","Microsoft Zira","Microsoft Michelle","Daniel","Alex"];

  function pickVoice(){
    if(!voices.length) loadVoices();
    if(!voices.length) return null;
    var en = voices.filter(function(v){ return /^en(-|_|$)/i.test(v.lang || ""); });
    if(!en.length) en = voices;
    for(var i=0;i<PREFERRED.length;i++){
      for(var j=0;j<en.length;j++){
        if((en[j].name || "").indexOf(PREFERRED[i]) === 0) return en[j];
      }
    }
    for(var k=0;k<en.length;k++){ if(/^en[-_]US/i.test(en[k].lang || "")) return en[k]; }
    return en[0];
  }

  function rate(){ return slow ? 0.62 : 0.86; }

  function utter(text, r){
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = r;
    u.pitch = 1.05;
    u.volume = 1;
    var v = pickVoice();
    if(v) u.voice = v;
    return u;
  }

  function cancelSpeech(){
    if(!hasSpeech) return;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    curUtt = null;
  }

  /* ── active word + guide bar ────────────────────── */
  function setActive(i){
    if(i === activeIdx) return;
    if(activeIdx > -1 && tokenEls[activeIdx]) tokenEls[activeIdx].classList.remove("active");
    activeIdx = i;
    if(i < 0 || !tokenEls[i]){
      elGuide.classList.remove("on");
      elGuide.style.width = "0px";
      return;
    }
    var el = tokenEls[i];
    el.classList.add("active");
    var wr = elWrap.getBoundingClientRect(), tr = el.getBoundingClientRect();
    elGuide.style.left = (tr.left - wr.left) + "px";
    elGuide.style.width = tr.width + "px";
    elGuide.classList.add("on");
  }

  /* ── karaoke clock (works with or without TTS) ──── */
  function clearTimers(){
    for(var i=0;i<timers.length;i++) clearTimeout(timers[i]);
    timers = [];
    if(endTimer){ clearTimeout(endTimer); endTimer = null; }
  }

  function estMs(w){
    var clean = w.replace(/[^A-Za-z']/g, "");
    var syl = (clean.match(/[aeiouy]+/gi) || []).length;
    if(syl < 1) syl = 1;
    var base = (150 + syl * 118) / rate();
    var last = w.slice(-1);
    if(last === "." ) base += 210 / rate();
    else if(last === "," || last === ";") base += 140 / rate();
    else if(last === "!" || last === "?") base += 190 / rate();
    return base;
  }

  function scheduleFrom(i, offset){
    for(var t=0;t<timers.length;t++) clearTimeout(timers[t]);
    timers = [];
    if(endTimer){ clearTimeout(endTimer); endTimer = null; }
    var delay = offset || 0;
    for(var n=i;n<tokens.length;n++){
      (function(n, d){
        timers.push(setTimeout(function(){ setActive(n); }, d));
      })(n, delay);
      delay += estMs(tokens[n]);
    }
    endTimer = setTimeout(function(){
      if(!sentenceActive) return;
      if(!speechStarted) finishSentence();
    }, delay + 400);
  }

  function tokenAt(charIndex){
    var cum = 0;
    for(var i=0;i<tokens.length;i++){
      var end = cum + tokens[i].length;
      if(charIndex < end) return i;
      cum = end + 1;
    }
    return tokens.length - 1;
  }

  /* ── reading ────────────────────────────────────── */
  var sentenceActive = false;

  function stopAll(){
    sentenceActive = false;
    clearTimers();
    cancelSpeech();
    setActive(-1);
  }

  function finishSentence(){
    sentenceActive = false;
    clearTimers();
    cancelSpeech();
    setActive(-1);
    if(autoAll){
      setTimeout(function(){
        if(!autoAll || sentenceActive) return;
        var n = (idx + 1) % LESSONS.length;
        if(n === 0){ setAuto(false); }
        show(n, true);
      }, 700);
    }
  }

  function readSentence(){
    stopAll();
    var L = LESSONS[idx];
    sentenceActive = true;
    speechStarted = false;
    activeIdx = -1;

    playAnim(L);

    if(!hasSpeech){
      scheduleFrom(0, 120);
      return;
    }

    curUtt = utter(tokens.join(" "), rate());
    var gotStart = false;
    curUtt.onstart = function(){ gotStart = true; speechStarted = true; };
    curUtt.onboundary = function(e){
      if(e.name && e.name !== "word") return;
      speechStarted = true;
      var i = tokenAt(e.charIndex || 0);
      if(i !== activeIdx){
        setActive(i);
        scheduleFrom(i + 1, estMs(tokens[i]));
      }
    };
    curUtt.onend = function(){ if(sentenceActive) finishSentence(); };
    curUtt.onerror = function(){ if(sentenceActive){ speechStarted = true; } };

    try{ window.speechSynthesis.cancel(); }catch(e){}
    window.speechSynthesis.speak(curUtt);
    scheduleFrom(0, 140);

    setTimeout(function(){
      if(sentenceActive && !gotStart && !speechStarted){
        cancelSpeech();
        speechStarted = false; // clock keeps driving the highlight
        scheduleFrom(0, 0);
      }
    }, 900);
  }

  function sayWord(el, i){
    stopAll();
    sentenceActive = false;
    var w = tokens[i].replace(/[^A-Za-z']/g, "");
    setActive(i);
    if(!hasSpeech || !w){
      setTimeout(function(){ setActive(-1); }, 620 / rate());
      return;
    }
    cancelSpeech();
    var u = utter(w, Math.max(0.6, rate() * 0.9));
    u.onend = function(){ setTimeout(function(){ if(!sentenceActive) setActive(-1); }, 150); };
    u.onerror = u.onend;
    window.speechSynthesis.speak(u);
    curUtt = u;
  }

  /* ── animation ──────────────────────────────────── */
  function playAnim(L){
    elFruit.className = "fruit";
    elFruitSm.className = "fruit-sm";
    void elFruit.offsetWidth;
    elFruit.classList.add("anim-" + L.anim);
    if(L.anim === "grow" && !elFruitSm.hidden) elFruitSm.classList.add("anim-shrink");
    if(typeof L.anim === "string") spawnFx(L.fx);
  }

  function spawnFx(list){
    if(reduced || !list || !list.length) return;
    for(var i=0;i<7;i++){
      (function(i){
        setTimeout(function(){
          var s = document.createElement("i");
          s.textContent = list[i % list.length];
          s.style.setProperty("--dx", (Math.random()*220 - 110).toFixed(0) + "px");
          s.style.setProperty("--dy", (-60 - Math.random()*110).toFixed(0) + "px");
          s.style.setProperty("--rot", (Math.random()*80 - 40).toFixed(0) + "deg");
          s.style.setProperty("font-size", (17 + Math.random()*13).toFixed(0) + "px");
          elFx.appendChild(s);
          setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1100);
        }, i * 85);
      })(i);
    }
  }

  /* ── render a lesson ────────────────────────────── */
  function buildSentence(L){
    elSent.innerHTML = "";
    tokens = []; tokenEls = [];
    var parts = L.sentence.split(/\s+/);
    var extra = L.extra || [];
    var target = L.word.toLowerCase();
    parts.forEach(function(p, i){
      var sp = document.createElement("span");
      sp.className = "tok";
      sp.textContent = p;
      sp.setAttribute("role", "button");
      sp.setAttribute("tabindex", "0");
      var bare = p.replace(/[^A-Za-z']/g, "").toLowerCase();
      if(bare === target || extra.indexOf(bare) > -1) sp.classList.add("extra");
      sp.addEventListener("click", function(){ sayWord(sp, i); });
      sp.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); sayWord(sp, i); }
      });
      elSent.appendChild(sp);
      tokens.push(p);
      tokenEls.push(sp);
    });
  }

  function show(i, autoplay){
    stopAll();
    idx = (i + LESSONS.length) % LESSONS.length;
    var L = LESSONS[idx];

    root.style.setProperty("--accent", L.color);
    root.style.setProperty("--accent-ink", L.ink);
    root.style.setProperty("--accent-soft", hexA(L.color, .16));

    for(var c=0;c<elChips.children.length;c++){
      elChips.children[c].classList.toggle("on", c === idx);
      elChips.children[c].setAttribute("aria-current", c === idx ? "true" : "false");
    }

    elFruit.className = "fruit";
    elFruit.textContent = L.fruit;
    elFruitSm.className = "fruit-sm";
    if(L.small){ elFruitSm.textContent = L.small; elFruitSm.hidden = false; }
    else { elFruitSm.hidden = true; }

    buildSentence(L);
    activeIdx = -1;
    elGuide.classList.remove("on");
    elGuide.style.width = "0px";

    elWord.textContent = L.word;
    elIpa.textContent = L.ipa;
    elCn.textContent = L.cn;
    elProg.textContent = (idx + 1) + " / " + LESSONS.length;

    elCard.classList.remove("enter");
    void elCard.offsetWidth;
    elCard.classList.add("enter");

    playAnim(L);

    if(autoplay) setTimeout(function(){ if(!sentenceActive) readSentence(); }, 380);
  }

  function hexA(hex, a){
    var h = hex.replace("#", "");
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
  }

  /* ── controls ───────────────────────────────────── */
  function buildChips(){
    LESSONS.forEach(function(L, i){
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.style.setProperty("--chip-c", L.ink);
      b.innerHTML = '<span class="em">' + L.fruit + "</span>" + L.word;
      b.addEventListener("click", function(){ dismissCoach(); show(i, true); });
      elChips.appendChild(b);
    });
  }

  function dismissCoach(){
    if(coached) return;
    coached = true;
    elCoach.classList.add("gone");
  }

  function setSlow(v){
    slow = v;
    $("slow").setAttribute("aria-pressed", v ? "true" : "false");
  }
  function setAuto(v){
    autoAll = v;
    $("all").setAttribute("aria-pressed", v ? "true" : "false");
  }

  buildChips();
  show(0, false);

  elPlay.addEventListener("click", function(){ dismissCoach(); readSentence(); });
  elFruit.addEventListener("click", function(){ dismissCoach(); readSentence(); });
  elFruit.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); dismissCoach(); readSentence(); }
  });
  $("prev").addEventListener("click", function(){ dismissCoach(); show(idx - 1, true); });
  $("next").addEventListener("click", function(){ dismissCoach(); show(idx + 1, true); });
  $("slow").addEventListener("click", function(){ dismissCoach(); setSlow(!slow); });
  $("all").addEventListener("click", function(){
    dismissCoach();
    var v = !autoAll;
    setAuto(v);
    if(v) readSentence(); else stopAll();
  });

  document.addEventListener("click", dismissCoach, { once:true });

  document.addEventListener("keydown", function(e){
    var tag = (e.target && e.target.tagName) || "";
    if(tag === "INPUT" || tag === "TEXTAREA") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); show(idx + 1, true); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); show(idx - 1, true); }
    else if(e.key === " "){ e.preventDefault(); readSentence(); }
  });

  window.addEventListener("pagehide", function(){ cancelSpeech(); });
  window.addEventListener("blur", function(){ /* keep reading; browsers handle it */ });
})();
</script>
